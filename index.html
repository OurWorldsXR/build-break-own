<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroller Template</title>
<!--
  A scroll-driven explainer engine.

  One pinned canvas behind a column of text. Scroll position drives a continuous
  progress value into whichever scene is on screen, so diagrams move as you read
  rather than cutting between states.

  EDIT THREE THINGS:
    1. PALETTE + TINT   the colours, and each scene's colour field
    2. SC.*             one draw function per scene, taking (p, t)
    3. BEATS            the running order: which scene, which layout, what copy

  Everything else is machinery. Search for "EDIT HERE".
-->
<style>
  :root{
    /* EDIT HERE: palette. keep text colours above 3:1 on the background. */
    --bg:#0D1626; --surf:#182741; --line:#2E4460; --fg:#F2F7FA; --mut:#A9C0D2;
    --dim:#6E8AA2; --accent:#4FC3E8; --good:#93C46F; --cool:#B98CD9;
    --bad:#E0664A; --warm:#F5B950;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-snap-type:y proximity}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);
    overflow-x:hidden;-webkit-font-smoothing:antialiased}

  #stage{position:fixed;inset:0;z-index:0;pointer-events:none}
  #cv{width:100%;height:100%;display:block}

  /* ---------- paper: the offline backstop and the classroom worksheet ---------- */
  @media print{
    @page{margin:16mm 15mm 18mm}
    :root{--fg:#111;--mut:#333;--dim:#555;--accent:#B8481A;--line:#bbb}
    html,body{background:#fff!important;color:#111!important}
    #cv,#idx,#clock,#stamp,#hint,#nav,#dots,#prog,canvas{display:none!important}
    .step{height:auto!important;min-height:0!important;display:block!important;
      opacity:1!important;transform:none!important;page-break-inside:avoid}
    .panel,.step[data-side="right"] .panel,.step[data-side="wide"] .panel{
      max-width:none!important;margin:0 0 6mm 0!important;padding:0!important;
      text-align:left!important;background:none!important}
    .panel::before{display:none!important}
    .step[data-side="full"] .panel{display:block!important}
    .step[data-side="wide"] p{max-width:none!important;margin-left:0!important}
    .scene{page-break-after:always;padding-top:2mm}
    .scene:last-child{page-break-after:auto}
    .scene::before{content:attr(data-scene);display:block;font-size:8pt;
      letter-spacing:.16em;text-transform:uppercase;color:#888;
      border-bottom:1px solid #ddd;padding-bottom:2mm;margin-bottom:5mm}
    h1{font-size:22pt;margin:0 0 4mm}
    h2{font-size:14pt;margin:0 0 3mm;page-break-after:avoid}
    p{font-size:10.5pt;line-height:1.5;margin:0 0 3mm;max-width:none}
    .lede{font-size:12pt;line-height:1.45}
    .kick{font-size:9pt;font-style:normal;font-weight:600;color:#B8481A;
      margin-bottom:2mm}
    .kick::after{display:none}
    .meta{font-size:8pt;color:#666;margin-top:4mm;border-top:1px solid #ddd;padding-top:2mm}
    .a,.b{color:#111;font-weight:600;text-decoration:underline;
      text-decoration-color:#ddd;text-underline-offset:2px}
    code{background:#f2f2f2;padding:0 2px;border-radius:2px;color:#111}
    /* room to write on the steps that ask for an answer */
    .scene[data-scene="counting"] .step:last-child .panel::after,
    .scene[data-scene="trace"] .step:last-child .panel::after,
    .scene[data-scene="verify"] .step:last-child .panel::after,
    .scene[data-scene="proof"] .step:last-child .panel::after{
      content:"";display:block;height:26mm;margin-top:4mm;
      border:1px solid #ccc;border-radius:2px}
  }

  article{position:relative;z-index:1}
  .scene{position:relative}
  .step{height:100vh;height:100dvh;display:flex;align-items:center;
    pointer-events:none;will-change:opacity,transform;
    scroll-snap-align:center;scroll-snap-stop:normal}

  /* four layouts. the canvas is sized around whichever is active. */
  .panel{pointer-events:auto;max-width:min(32vw,470px);margin-left:5.5vw;
    padding:2rem 2.5rem 2rem 0;position:relative;
    text-shadow:0 1px 2px rgba(0,0,0,.95), 0 2px 22px rgba(0,0,0,.85)}
  .step[data-side="right"]{justify-content:flex-end}
  .step[data-side="right"] .panel{margin-left:0;margin-right:5.5vw;padding:2rem 0 2rem 2.5rem}
  .step[data-side="wide"]{justify-content:center}
  .step[data-side="wide"] .panel{max-width:min(62vw,900px);margin:0;text-align:center;padding:2rem}
  .step[data-side="full"] .panel{display:none}
  .panel:not(.bare)::before{content:"";position:absolute;inset:-4vh -6vw;z-index:-1;
    background:radial-gradient(60% 50% at 30% 50%,rgba(13,22,38,.95) 0%,rgba(13,22,38,.78) 55%,rgba(13,22,38,0) 100%)}
  .step[data-side="right"] .panel::before{
    background:radial-gradient(60% 50% at 70% 50%,rgba(13,22,38,.95) 0%,rgba(13,22,38,.78) 55%,rgba(13,22,38,0) 100%)}
  .step[data-side="wide"] .panel::before{
    background:radial-gradient(70% 60% at 50% 50%,rgba(13,22,38,.96) 0%,rgba(13,22,38,.82) 55%,rgba(13,22,38,0) 100%)}
  .panel.bare::before{display:none}
  body.talk .step:not([data-talk]) .panel{opacity:.18;filter:saturate(.4)}
  body.build .step:not([data-build]) .panel{opacity:.15;filter:saturate(.3)}
  body.kitB .kitA{display:none!important}
  body:not(.kitB) .kitB{display:none!important}
  .kitbadge{display:inline-block;font-size:.8rem;letter-spacing:.04em;padding:.15em .6em;border-radius:1em;
    background:#1d6fd8;color:#fff;margin-right:.4em;vertical-align:middle}
  body.kitB .kitbadge{background:#7a4fb0}
  .panel img{display:block;width:100%;max-width:470px;border-radius:8px;margin:.7rem 0;background:#fff}

  .kick{font-size:clamp(.85rem,1vw,1rem);letter-spacing:.005em;color:var(--accent);
    margin-bottom:1.15rem;font-weight:500;font-style:italic}
  .kick::after{content:"";display:block;width:2.4rem;height:1px;
    background:var(--accent);margin-top:.55rem;opacity:.7}
  h1{font-size:clamp(2.6rem,6.2vw,6rem);line-height:.95;letter-spacing:-.025em;
    font-weight:800;margin-bottom:1.4rem}
  h2{font-size:clamp(1.7rem,3.3vw,3rem);line-height:1.06;letter-spacing:-.018em;
    font-weight:750;margin-bottom:1.1rem}
  p{font-size:clamp(1rem,1.35vw,1.3rem);line-height:1.58;color:var(--mut);
    margin-bottom:.9rem;max-width:36ch}
  .step[data-side="wide"] p{max-width:58ch;margin-left:auto;margin-right:auto}
  p strong{color:var(--fg);font-weight:600}
  p .a{color:var(--accent)} p .g{color:var(--good)} p .c{color:var(--cool)} p .b{color:var(--bad)}
  code,.mono{font-family:var(--mono);font-size:.92em;color:var(--cool)}
  .panel a{color:var(--accent);text-decoration:none;
    border-bottom:1px solid rgba(79,195,232,.4);transition:border-color .15s}
  .panel a:hover{border-bottom-color:var(--accent)}
  .lede{color:var(--fg);font-size:clamp(1.15rem,1.75vw,1.65rem);line-height:1.4;max-width:30ch}
  .meta{font-size:.86rem;color:var(--dim);margin-top:2.2rem;line-height:1.9}
  .meta span{display:block}

  #bar{position:fixed;left:0;top:0;height:2px;background:var(--accent);width:0;z-index:4;
    transition:width .12s linear}
  #cue{position:fixed;left:50%;bottom:2.2rem;transform:translateX(-50%);z-index:4;
    font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    transition:opacity .6s ease}
  #cue.gone{opacity:0}
  #build{position:fixed;right:.9rem;bottom:.7rem;z-index:4;font-size:.6rem;
    letter-spacing:.14em;color:#2E4460;font-family:var(--mono)}
  #count{position:fixed;right:.9rem;top:1rem;z-index:4;font-size:.68rem;
    letter-spacing:.16em;color:var(--dim);font-family:var(--mono);opacity:0;
    transition:opacity .4s ease}
  #count.on{opacity:1}
  #clock{position:fixed;left:1.1rem;top:1rem;z-index:4;font-family:var(--mono);
    font-size:.72rem;letter-spacing:.1em;color:var(--dim);display:none}
  #clock.on{display:block}
  #clock b{font-weight:400;color:var(--fg)}
  #clock .ahead{color:var(--good)} #clock .late{color:var(--bad)}
  #idx{position:fixed;inset:0;z-index:6;background:rgba(10,17,30,.98);display:none;
    padding:5vh 7vw;overflow:auto}
  #idx.on{display:block}
  #idx h3{font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);
    margin-bottom:1.8rem}
  #idx ol{list-style:none;columns:2;column-gap:5rem}
  #idx li{padding:.5rem 0;color:var(--mut);cursor:pointer;font-size:1.05rem;
    border-bottom:1px solid #17171E;break-inside:avoid}
  #idx li:hover{color:var(--accent)}
  #idx li b{color:var(--dim);font-family:var(--mono);font-size:.82rem;margin-right:1rem}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<article id="art"></article>
<div id="bar"></div><div id="cue">scroll &middot; B build path &middot; T full tour</div>
<div id="build"></div><div id="count"></div><div id="clock"></div>
<div id="idx"><h3>Contents</h3><ol></ol></div>

<script>
(()=>{
"use strict";
const BUILD='template-1';
/* NO console.* ANYWHERE. some embed runtimes do not provide it and it throws. */

const C={bg:'#0D1626',surf:'#182741',line:'#2E4460',fg:'#F2F7FA',mut:'#A9C0D2',
 dim:'#6E8AA2',accent:'#4FC3E8',good:'#93C46F',cool:'#B98CD9',bad:'#E0664A',warm:'#F5B950'};
const SANS='ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const MONO='ui-mono'+'space,SFMono-Regular,Menlo,Consolas,monospace';
const cv=document.getElementById('cv'),x=cv.getContext('2d');
let W=0,H=0,DPR=1,U=1;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- drawing helpers. px() scales everything off the viewport. ---------- */
const px=v=>v*U;
function rect(a,b,w,h,c){x.fillStyle=c;x.fillRect(a,b,w,h)}
function frame(a,b,w,h,c,lw){x.strokeStyle=c;x.lineWidth=lw||px(1.5);x.strokeRect(a,b,w,h)}
function dash(a,b,w,h,c,lw){x.save();x.setLineDash([px(7),px(6)]);
  x.strokeStyle=c;x.lineWidth=lw||px(1.5);x.strokeRect(a,b,w,h);x.restore()}
function txt(s,a,b,c,sz,f,al){x.fillStyle=c;x.font=(f||'500 ')+px(sz)+'px '+SANS;
  x.textAlign=al||'left';x.textBaseline='top';x.fillText(s,a,b)}
function mono(s,a,b,c,sz,al){x.fillStyle=c;x.font=px(sz)+'px '+MONO;
  x.textAlign=al||'left';x.textBaseline='top';x.fillText(s,a,b)}
function arrow(x1,y1,x2,y2,c){
  x.strokeStyle=c;x.lineWidth=px(2);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
  const an=Math.atan2(y2-y1,x2-x1),h=px(9);
  x.fillStyle=c;x.beginPath();x.moveTo(x2,y2);
  x.lineTo(x2-h*Math.cos(an-0.4),y2-h*Math.sin(an-0.4));
  x.lineTo(x2-h*Math.cos(an+0.4),y2-h*Math.sin(an+0.4));x.closePath();x.fill()}
function card(a,b,w,h,c,heavy){rect(a,b,w,h,C.surf);frame(a,b,w,h,c||C.line,px(heavy?2:1.2))}
function ease(k){k=Math.max(0,Math.min(1,k));return 1-Math.pow(1-k,3)}
/* clampP(p,i): 0 until step i, ramping to 1 by step i+1. the workhorse. */
function clampP(p,i){return Math.max(0,Math.min(1,p-i))}
function typed(s,t,rate){return String(s).slice(0,Math.max(0,Math.floor(t*rate)))}
function wrapTxt(s,a,b,w,c,sz,lh){
  x.fillStyle=c;x.font='500 '+px(sz)+'px '+SANS;x.textAlign='left';x.textBaseline='top';
  const words=String(s).split(' ');let line='',y=b;
  words.forEach(wd=>{const t2=line?line+' '+wd:wd;
    if(x.measureText(t2).width>w&&line){x.fillText(line,a,y);y+=px(lh);line=wd}else line=t2});
  if(line)x.fillText(line,a,y);
  return y+px(lh);
}
/* display type as a graphic. keep it on the page and above 15% or it reads as dirt. */
function slab(s,cx,cy,sz,col,al,rot){
  x.save();x.globalAlpha=al===undefined?1:al;
  x.translate(cx,cy);if(rot)x.rotate(rot);
  x.fillStyle=col;x.font='800 '+px(sz)+'px '+SANS;
  x.textAlign='center';x.textBaseline='middle';x.fillText(s,0,0);x.restore();
}

/* ---------- background: colour field + grain ----------
   EDIT HERE: give every scene a tint so the screen changes temperature as you
   scroll. [hex, strength]. This is the cheapest way to stop 40 dark scenes
   feeling like one long dark scene. */
/* each scene is an hour on the land: ember, dawn, full light, dusk */
/* first light to last: each step is a different hour on the same ground */
const TINT={
  opening:['#1B2E52',.40], replica:['#2A1E3A',.30], paths:['#24365C',.32], journey:['#22405C',.30], land:['#3E2F5E',.38],
  kit:['#2A3A66',.30], why:['#14324A',.30], freedoms:['#16384E',.30], tension:['#3A2A54',.34], card:['#1F3B5C',.28], power:['#1C4A5E',.30],
  counting:['#20455A',.26], wires:['#255050',.28], bus:['#2A5548',.30], shiprock:['#5A3020',.38], code:['#3E2A22',.36], cylinder:['#4A3218',.36], reo:['#1E4A46',.32],
  missing:['#5A3A2A',.32], verify:['#5A4A22',.32], screen:['#2E3560',.28],
  sunpath:['#2A4A6E',.26], shield:['#3A5240',.30], proof:['#4A4A28',.30], trace:['#4A2A50',.34], databack:['#4A2438',.36], care:['#25405A',.30], spectrum:['#2E4A64',.32],
  yours:['#6A3A48',.40], next:['#14344C',.30], closing:['#7A4230',.46],
  q1:['#101C2E',.52], q2:['#101C2E',.52], q3:['#101C2E',.52], q4:['#101C2E',.52], q5:['#101C2E',.52], q6:['#101C2E',.52], q7:['#101C2E',.52], q8:['#101C2E',.52], q9:['#101C2E',.52], q10:['#101C2E',.52], q11:['#101C2E',.52], q12:['#101C2E',.52], 
  recapA:['#1C3A50',.34], recapB:['#1C3A50',.34], recapC:['#1C3A50',.34], recapD:['#1C3A50',.34]
};
let GRAIN=null;
function grain(){
  if(GRAIN===null){
    GRAIN=false;
    try{
      const c2=document.createElement('canvas');c2.width=160;c2.height=160;
      const g2=c2.getContext('2d');
      if(g2&&g2.createImageData){
        const d=g2.createImageData(160,160);
        for(let i=0;i<d.data.length;i+=4){
          const v=(Math.random()*255)|0;
          d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=14;}
        g2.putImageData(d,0,0);GRAIN=c2;
      }
    }catch(e){GRAIN=false}
  }
  if(!GRAIN)return;
  try{const pat=x.createPattern(GRAIN,'repeat');
    if(pat){x.save();x.globalAlpha=.5;x.fillStyle=pat;x.fillRect(0,0,W,H);x.restore()}
  }catch(e){}
}
/* EDIT HERE: replace this with your own scenery, or leave it as a plain field. */
/* which movement each scene belongs to, so the reader always knows where they are */
const ACT={
 opening:0,replica:0,paths:0,journey:0,land:0,
 kit:1,why:1,freedoms:1,card:1,power:1,counting:1,wires:1,bus:1,q1:1,q2:1,q3:1,recapA:1,
 shiprock:2,code:2,cylinder:2,missing:2,verify:2,recapB:2,screen:2,
 sunpath:2,shield:2,proof:2,q4:2,q5:2,q6:2,recapB:2,q7:2,q8:2,q9:2,recapC:2,
 trace:3,databack:3,care:3,tension:3,reo:3,spectrum:3,q10:3,q11:3,q12:3,recapD:3,next:3,yours:3,closing:3
};
const ACTNAME=['','BUILD IT','BREAK IT','OWN IT'];
const ACTOF=[0,9,11,10];
function actIndex(scene){
  const a=ACT[scene]; if(!a) return null;
  let n=0; for(const k in ACT){ if(ACT[k]===a){ n++; if(k===scene) return [a,n]; } }
  return [a,n];
}
function youAreHere(scene,t){
  const ix=actIndex(scene); if(!ix) return;
  const [a,n]=ix, X=W-px(38), Y=px(40);
  x.save();x.textAlign='right';x.textBaseline='top';
  x.globalAlpha=.85;x.fillStyle=C.accent;
  x.font='700 '+px(11)+'px '+MONO;x.fillText(ACTNAME[a],X,Y);
  x.globalAlpha=.55;x.fillStyle=C.mut;
  x.font=px(10)+'px '+MONO;x.fillText('STOP '+n+' OF '+ACTOF[a],X,Y+px(16));
  for(let i=1;i<=3;i++){
    const on=(i===a);
    x.globalAlpha=on?0.9:0.22;x.fillStyle=on?C.accent:C.mut;
    rect(X-px(10)-(3-i)*px(16),Y+px(34),px(10),px(3),x.fillStyle);
  }
  x.restore();
}
function cl01(v){return v<0?0:(v>1?1:v)}
function hx(c){return '#'+[0,1,2].map(i=>Math.max(0,Math.min(255,Math.round(c[i])))
  .toString(16).padStart(2,'0')).join('')}
function rgbOf(s){
  return [parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
}
/* returns hex, so mixes can be chained */
function mix(a,b,f){
  f=cl01(f);const A=rgbOf(a),B=rgbOf(b);
  return hx([A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f]);
}
/* az: 0 sunrise, 1 sunset. alt: 0 horizon, ~1 zenith. every scene picks its hour. */
function arc(u,peak){return Math.sin(cl01(u)*Math.PI)*peak}
function SKY(scene,p,t){
  if(scene==='sunpath'){
    const june=p<1.6, u=june?cl01(p/1.6):cl01((p-1.6)/1.6);
    return {az:0.04+u*0.92, alt:arc(u,june?0.86:0.30)};
  }
  if(scene==='shield'){ const u=0.30; return {az:0.20,alt:arc(u,0.30)}; }
  if(scene==='proof'){ const u=cl01(p/3.2); return {az:0.04+u*0.92, alt:arc(u,0.74)}; }
  if(scene==='opening'||scene==='land'){ return {az:0.90,alt:0.10}; }
  if(scene==='replica'){ return {az:0.12,alt:0.12}; }
  if(scene==='paths'){ return {az:0.16,alt:0.20}; }
  if(scene==='journey'){ return {az:0.22,alt:0.28}; }
  if(scene==='why'){ return {az:0.30,alt:0.44}; }
  if(scene==='freedoms'){ return {az:0.34,alt:0.50}; }
  if(scene==='tension'){ return {az:0.70,alt:0.20}; }
  if(scene==='yours'||scene==='closing'){ return {az:0.95,alt:0.05}; }
  if(scene==='code'){ return {az:0.88,alt:0.09}; }
  if(scene==='shiprock'){ return {az:0.10,alt:0.16}; }
  if(String(scene).indexOf('recap')===0){ return {az:0.50,alt:0.40}; }
  if(/^q\d+$/.test(String(scene))){ return {az:0.50,alt:0.02}; }
  if(scene==='cylinder'){ return {az:0.12,alt:0.13}; }
  if(scene==='reo'){ return {az:0.34,alt:0.52}; }
  if(scene==='databack'){ return {az:0.24,alt:0.38}; }
  if(scene==='next'){ return {az:0.86,alt:0.14}; }
  if(scene==='care'){ return {az:0.28,alt:0.46}; }
  if(scene==='spectrum'){ return {az:0.16,alt:0.30}; }
  if(scene==='missing'||scene==='verify'){ return {az:0.80,alt:0.22}; }
  return {az:0.72,alt:0.34};
}
function backdrop(prog,t,dim,scene,sp){
  /* ---- the environment is the diagram. scenes drive the sun. ---- */
  const E=SKY(scene,sp===undefined?0:sp,t);
  const HZ=H*0.795;
  const az=E.az, alt=E.alt;
  const sunX=W*(0.06+az*0.88), sunY=HZ-alt*HZ*0.94;
  const day=cl01(alt/0.42), lowsun=cl01(1-Math.abs(alt-0.10)/0.26);
  let zen=mix('#080F1E','#1B5A96',day);
  let mid=mix('#141F3C','#4E9AC8',day); mid=mix(mid,'#8E5470',lowsun*0.75);
  let hor=mix('#1E1A34','#A9D6EA',day); hor=mix(hor,'#EC9A56',lowsun*0.90);
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,zen);g.addColorStop(0.42,mid);g.addColorStop(0.76,hor);
  g.addColorStop(1,mix('#2A1C34','#3E3A46',day));
  x.fillStyle=g;x.fillRect(0,0,W,H);

  /* stars, only when the sun is down or nearly */
  const night=cl01(1-alt/0.18);
  if(night>0.02)for(let i=0;i<54;i++){
    const sd=i*97.3, sx2=(sd*13.7)%W, sy2=((sd*7.1)%(H*0.46));
    const tw=RM?0.5:(0.35+0.65*Math.abs(Math.sin(t*0.7+i)));
    x.save();x.globalAlpha=tw*0.46*night;
    x.fillStyle=i%6===0?'#F5B950':'#DCEAF4';
    x.beginPath();x.arc(sx2,sy2,px(0.9+(i%3)*0.4),0,7);x.fill();x.restore();
  }

  /* the sun itself, in the real sky */
  if(alt>-0.02){
    const gg=x.createRadialGradient(sunX,sunY,0,sunX,sunY,px(120));
    const sunCol=mix('#FF9A4A','#FFF0C4',day);
    gg.addColorStop(0,sunCol);gg.addColorStop(0.18,'rgba(255,200,120,0.30)');
    gg.addColorStop(1,'rgba(255,180,90,0)');
    x.save();x.globalAlpha=0.55+day*0.30;x.fillStyle=gg;
    x.beginPath();x.arc(sunX,sunY,px(120),0,7);x.fill();
    x.globalAlpha=0.95;x.fillStyle=sunCol;
    x.beginPath();x.arc(sunX,sunY,px(15),0,7);x.fill();x.restore();
  }

  /* far ridge, lit on the sun side */
  const drift=RM?0:t*1.6;
  x.save();x.globalAlpha=.46;x.fillStyle=mix('#25314E','#5D7FA0',day*0.6);
  x.beginPath();x.moveTo(0,H);
  for(let i=0;i<=24;i++){const u=i/24, xx=((u*W)+drift*0.30)%(W*1.2)-W*0.1;
    x.lineTo(xx,H*0.665+Math.sin(u*5.1+1.4)*H*0.035);}
  x.lineTo(W,H);x.closePath();x.fill();x.restore();

  /* the panels: same land, four hours, each catching the light */
  const PANEL=[[0.13,0.40,'#7FC9E8'],[0.345,0.33,'#F0C97A'],
               [0.615,0.44,'#C58AD0'],[0.845,0.36,'#7FB08A']];
  PANEL.forEach((P,i)=>{
    const sway=RM?0:Math.sin(t*0.28+i*1.7)*px(3);
    const pw=W*0.115, ph=H*P[1], px0=W*P[0]-pw/2, py=HZ-ph+sway;
    const face=cl01(1-Math.abs(W*P[0]-sunX)/(W*0.55));
    const pg=x.createLinearGradient(0,py,0,py+ph);
    pg.addColorStop(0,P[2]);pg.addColorStop(1,'rgba(255,255,255,0.02)');
    x.save();x.globalAlpha=.14+face*0.22;x.fillStyle=pg;x.fillRect(px0,py,pw,ph);
    x.globalAlpha=.22+face*0.34;x.strokeStyle=P[2];x.lineWidth=px(1);
    x.strokeRect(px0,py,pw,ph);x.restore();
  });

  /* near ridge */
  const ridge=[[0,0.845],[0.15,0.845],[0.205,0.792],[0.35,0.792],[0.395,0.862],
               [0.56,0.862],[0.615,0.778],[0.79,0.778],[0.835,0.838],[1,0.838]];
  /* its shadow, thrown away from the sun and long when the sun is low */
  if(alt>0.01){
    const len=px(30)+ (1-cl01(alt/0.5))*px(210);
    const dir=(sunX>W*0.5)?-1:1;
    x.save();x.globalAlpha=0.22*(1-day*0.4);x.fillStyle='#0A0E1C';
    x.beginPath();x.moveTo(0,H);
    ridge.forEach(r=>x.lineTo(W*r[0]+dir*len,H*r[1]+px(16)));
    x.lineTo(W,H);x.closePath();x.fill();x.restore();
  }
  x.save();x.globalAlpha=.97;x.fillStyle=mix('#12101F','#241E33',day*0.5);
  x.beginPath();x.moveTo(0,H);
  ridge.forEach(r=>x.lineTo(W*r[0],H*r[1]));
  x.lineTo(W,H);x.closePath();x.fill();x.restore();
  x.save();x.globalAlpha=dim===undefined?0.80:dim;rect(0,0,W,H,C.bg);x.restore();
  const T=TINT[scene]||['#141426',.24];
  const rg=x.createRadialGradient(W*0.5,H*0.42,0,W*0.5,H*0.42,W*0.78);
  rg.addColorStop(0,T[0]);rg.addColorStop(1,'rgba(0,0,0,0)');
  x.save();x.globalAlpha=T[1];x.fillStyle=rg;x.fillRect(0,0,W,H);x.restore();
  grain();
}

/* ---------- the console chassis ----------
   Hold one frame and change one variable at a time. Reusing this across a run of
   scenes is the single biggest thing you can do for comprehension: the reader
   learns to read the instruments once, then just watches them move. */
const RAILX=()=>W*0.808, RAILW=()=>W*0.162;
function rail(st,t){
  const rx=RAILX(),rw=RAILW(),top=H*0.14;
  card(rx,top,rw,px(146),'#26262E');
  mono(st.title||'STATE',rx+px(14),top+px(14),C.mut,11);
  (st.lines||[]).slice(0,4).forEach((g,i)=>mono(g,rx+px(14),top+px(42)+i*px(23),C.fg,12));
  if(st.flag)mono(st.flag,rx+px(14),top+px(120),st.flagOk?C.good:C.bad,12);
  const my=top+px(180);
  rect(rx,my,rw,px(8),C.accent);
  x.save();x.globalAlpha=.18;rect(rx,my+px(8),rw,px(26),C.accent);x.restore();
  mono(st.meterName||'METER',rx,my-px(18),C.accent,11);
  const hits=st.hits||0;
  for(let i=0;i<Math.min(4,hits);i++){
    x.save();x.globalAlpha=.45+((Math.sin(t*6+i*1.3)+1)/2)*.55;
    arrow(rx+px(20)+i*px(30),my-px(46),rx+px(20)+i*px(30),my-px(6),C.bad);x.restore();
  }
  mono(hits?(st.hitLabel||'events')+' x'+hits:'none',rx,my+px(44),hits?C.bad:C.mut,12);
  const ly=my+px(88);
  mono(st.logName||'LOG',rx,ly,C.mut,11);
  const n=st.entries||0;
  for(let i=0;i<Math.min(7,n);i++){
    rect(rx+i*px(21),ly+px(20),px(15),px(19),'#16161C');
    frame(rx+i*px(21),ly+px(20),px(15),px(19),C.warm,px(1));
    if(i)rect(rx+i*px(21)-px(6),ly+px(28),px(6),px(2),C.warm);
  }
  mono(n+' recorded',rx,ly+px(50),C.mut,11);
  if(st.note){x.save();x.globalAlpha=.9;
    wrapTxt(st.note,rx,ly+px(74),rw,C.cool,12,17);x.restore()}
}

/* rows that slide in and get a light passed over them as they land */
function briefRows(rows,p,x0,w,y0,rowh){
  rows.forEach((r,i)=>{
    const on=Math.min(1,Math.max(0,p*1.6-i*0.30)),e=ease(on);
    x.save();x.globalAlpha=.10+on*.90;
    const y=y0+i*rowh, slide=(1-e)*px(46);
    rect(x0-slide,y,px(4),(rowh-px(16))*e,r[3]);
    mono(r[0],x0+px(20)-slide,y+px(2),r[3],12);
    txt(r[1],x0+px(20)-slide,y+px(20),C.fg,19,'700 ');
    wrapTxt(r[2],x0+px(20)-slide,y+px(46),w-px(40),C.mut,14,20);
    if(on>0.55&&on<1){
      const k=(on-0.55)/0.45,g=x.createLinearGradient(x0,0,x0+w,0);
      g.addColorStop(Math.max(0,k-0.14),'rgba(255,255,255,0)');

      g.addColorStop(Math.min(1,k+0.14),'rgba(255,255,255,0)');
      x.fillStyle=g;x.fillRect(x0,y,w,rowh-px(16));
    }
    x.restore();
  });
}

const SC={};

function ring360(cx,cy,r,al,t){
  x.save();x.globalAlpha=al===undefined?1:al;
  x.strokeStyle=C.accent;x.lineWidth=px(1.5);
  for(let d=-42;d<=42;d+=15){
    const a=(d-90)*Math.PI/180, big=(d%30===0), L=big?px(12):px(6);
    x.globalAlpha=(al===undefined?1:al)*(big?0.85:0.38);
    x.beginPath();x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    x.lineTo(cx+Math.cos(a)*(r+L),cy+Math.sin(a)*(r+L));x.stroke();
  }
  x.globalAlpha=(al===undefined?1:al)*0.7;
  x.beginPath();x.arc(cx,cy,r,-2.36,-0.78);x.stroke();
  x.restore();
}
function wordmark(cx,cy,sz,col,al){
  x.save();x.globalAlpha=al===undefined?1:al;
  x.strokeStyle=col;x.lineWidth=px(sz*0.09);
  x.beginPath();x.arc(cx-px(sz*3.15),cy,px(sz*0.46),-0.30,5.55);x.stroke();
  x.fillStyle=col;x.font='500 '+px(sz)+'px '+SANS;
  x.textAlign='left';x.textBaseline='middle';
  let ox=cx-px(sz*2.4);
  for(const ch of 'OUR WORLDS'){x.fillText(ch,ox,cy);ox+=x.measureText(ch).width+px(sz*0.36)}
  x.restore();
}
function pinXY(bx,by,bw,bh,hdr,n){
  const col=Math.ceil(n/2), sp=bw/19, cx=bx+sp*col;
  const inner=(n%2===1)?px(11):px(23);
  return [cx, hdr==='P1' ? by+inner : by+bh-inner];
}
function board(bx,by,bw,hi,card){
  const bh=bw/1.6;
  rect(bx,by,bw,bh,'#14332C'); frame(bx,by,bw,bh,'#4FA383',px(1.6));
  rect(bx+bw*0.40,by+bh*0.38,bw*0.20,bh*0.26,'#0C0906');
  mono('AM6254',bx+bw*0.50,by+bh*0.46,C.mut,9,'center');
  rect(bx-px(3),by+bh*0.40,px(8),bh*0.22,'#5A6B7C');
  rect(bx+bw-px(6),by+bh*0.36,px(9),bh*0.30,'#3A4A5C');
  if(card){rect(bx+bw-px(4),by+bh*0.38,px(16),bh*0.26,'#E0C089')}
  for(let n=1;n<=36;n++){['P1','P2'].forEach(h=>{
    const q=pinXY(bx,by,bw,bh,h,n), on=hi&&hi[h+'_'+String(n).padStart(2,'0')];
    x.fillStyle=on?on:'#8FA6B8';
    x.beginPath();x.arc(q[0],q[1],px(on?3.4:2.2),0,7);x.fill();
    if(on){x.save();x.globalAlpha=.28;x.beginPath();
      x.arc(q[0],q[1],px(9),0,7);x.fillStyle=on;x.fill();x.restore()}
  })}
  mono('P1',bx+px(3),by+px(2),C.dim,8);
  mono('P2',bx+px(3),by+bh-px(11),C.dim,8);
  return bh;
}
function brk(bx,by,bw,label,sub,col,labels,lit){
  const bh=bw*0.52;
  rect(bx,by,bw,bh,'#132238'); frame(bx,by,bw,bh,col,px(1.4));
  txt(label,bx+bw/2,by+bh*0.26,C.fg,13,'600 ','center');
  mono(sub,bx+bw/2,by+bh*0.52,C.mut,9,'center');
  const sp=bw/5, pts=[];
  (labels||[]).forEach((L,i)=>{
    const cx=bx+sp*(i+1), on=lit&&lit[L];
    x.fillStyle=on||'#8FA6B8';
    x.beginPath();x.arc(cx,by+bh-px(6),px(on?3.2:2.4),0,7);x.fill();
    mono(L,cx,by+bh+px(3),on||C.dim,8,'center');
    pts.push([cx,by+bh-px(6)]);
  });
  return pts;
}
/* a soft curved wire between two points */
function wire(x1,y1,x2,y2,col,al){
  x.save();x.globalAlpha=al===undefined?1:al;
  x.strokeStyle=col;x.lineWidth=px(2.4);x.lineCap='round';
  x.beginPath();x.moveTo(x1,y1);
  x.bezierCurveTo(x1+(x2-x1)*0.45,y1,x1+(x2-x1)*0.55,y2,x2,y2);
  x.stroke();x.restore();
}

    x.globalAlpha=a*0.5;x.strokeStyle=C.accent;x.lineWidth=px(1.4);
    x.beginPath();x.arc(L,cy,r,0,7);x.stroke();
    mono('OPEN SOURCE',L-px(60),cy-r-px(26),C.accent,12);}
  if(b>0){x.globalAlpha=b*0.16;x.fillStyle=C.good;
    x.beginPath();x.arc(R,cy,r,0,7);x.fill();
    x.globalAlpha=b*0.5;x.strokeStyle=C.good;x.lineWidth=px(1.4);
    x.beginPath();x.arc(R,cy,r,0,7);x.stroke();
    mono('CARE / KAITIAKITANGA',R-px(20),cy-r-px(26),C.good,12);}
  x.restore();
  const o=ease(clampP(p,2));
  if(o>0){
    x.save();x.globalAlpha=o;
    ['read it','change it','share it'].forEach((s,i)=>
      mono(s,cx,cy-px(22)+i*px(22),C.fg,13,'center'));
    x.restore();
  }
  const c=ease(clampP(p,3));
  if(c>0){
    x.save();x.globalAlpha=c;
    ['anyone at all','any purpose','no exceptions'].forEach((s,i)=>
      mono(s,L-px(58),cy-px(22)+i*px(22),C.accent,12,'center'));
    ['the nation decides','benefit comes back','some uses refused'].forEach((s,i)=>
      mono(s,R+px(62),cy-px(22)+i*px(22),C.good,12,'center'));
    x.restore();
  }
  const f=ease(clampP(p,4));
  if(f>0){x.save();x.globalAlpha=f;
    wrapTxt('Both of these are good. They do not fit together. That is not a fault in either one, and nobody gets to skip the choice.',
      W*0.44,H*0.74,W*0.42,C.warm,17,25);x.restore()}
};

/* ---- 0c. the whole road, before you start walking it ---- */
SC.journey=(p,t)=>{
  const acts=[[1,'BUILD IT','you make a working instrument',
               ['the parts','the card','power','the pins','the wires','the bus'],C.accent],
              [2,'BREAK IT','you find out who else has been here',
               ['Shiprock 1965','France 1918','Maine 1890','the chip','the sun'],C.warm],
              [3,'OWN IT','you decide what happens next',
               ['your phone','CARE','Aotearoa','the airwaves'],C.good]];
  const x0=W*0.44, w=W*0.47, top=H*0.20;
  acts.forEach((A,i)=>{
    const on=ease(Math.min(1,Math.max(0,p*1.2-i*0.42)));
    if(on<=0)return;
    const y=top+i*px(150);
    x.save();x.globalAlpha=on;
    x.fillStyle=A[5];x.font='700 '+px(30)+'px '+SANS;
    x.textAlign='left';x.textBaseline='top';x.fillText(String(A[0]),x0,y);
    txt(A[1],x0+px(44),y+px(4),A[5],20,'700 ');
    mono(A[2],x0+px(44),y+px(32),C.mut,12);
    /* the stops on this leg */
    const sw=(w-px(60))/A[3].length;
    A[3].forEach((s,j)=>{
      const sx=x0+px(46)+j*sw, sy=y+px(62);
      x.globalAlpha=on*0.9;
      x.fillStyle=A[5];x.beginPath();x.arc(sx,sy,px(4),0,7);x.fill();
      if(j<A[3].length-1){
        x.globalAlpha=on*0.3;x.strokeStyle=A[5];x.lineWidth=px(1.4);
        x.beginPath();x.moveTo(sx+px(6),sy);x.lineTo(sx+sw-px(6),sy);x.stroke();
      }
      x.globalAlpha=on*0.75;
      x.save();x.translate(sx-px(2),sy+px(14));x.rotate(0.62);
      mono(s,0,0,C.mut,10);x.restore();
    });
    /* the checkpoint that closes the leg */
    x.globalAlpha=on*0.85;
    mono('\u25A1 checkpoint',x0+px(46)+A[3].length*sw-px(10),y+px(56),C.accent,10);
    x.restore();
  });
};

/* ---- 1. what is in the box ---- */
SC.kit=(p,t)=>{
  const items=[
    ['the computer','PocketBeagle 2','1',C.good],
    ['the memory','microSD card','1',C.warm],
    ['the sensor','BME280','1',C.accent],
    ['the screen','SSD1306 OLED','1',C.cool],
    ['the button','push button','1',C.bad],
    ['the wires','jumper leads','8',C.mut]];
  const x0=W*0.46, cw=W*0.155, ch=px(120);
  items.forEach((it,i)=>{
    const on=ease(Math.min(1,Math.max(0,p*1.5-i*0.28)));
    if(on<=0)return;
    const bounce=(1-on)*px(26)-Math.sin(on*Math.PI)*px(7);
    const cx=x0+(i%3)*(cw+px(18)), cy=H*0.26+Math.floor(i/3)*(ch+px(28))+bounce;
    x.save();x.globalAlpha=on;
    card(cx,cy,cw,ch,it[3]);
    txt(it[2],cx+cw-px(14),cy+px(12),it[3],26,'700 ','right');
    mono(it[0],cx+px(12),cy+px(16),C.dim,10);
    wrapTxt(it[1],cx+px(12),cy+px(58),cw-px(24),C.fg,15,20);
    x.restore();
  });
  if(p>=5){x.save();x.globalAlpha=ease(clampP(p,5));
    wrapTxt('Count them before you start. A missing wire found now costs a minute; found later it costs an hour.',
      x0,H*0.26+2*(ch+px(28))+px(10),W*0.46,C.accent,14,21);x.restore()}
};

/* ---- 2. the card goes in first ---- */
SC.card=(p,t)=>{
  const bw=W*0.28,bx=W*0.48,by=H*0.38;
  const slid=ease(clampP(p,1));
  const bh=board(bx,by,bw,null,false);
  /* the card, sliding home */
  const cxs=bx+bw+px(120)-slid*px(112);
  x.save();x.globalAlpha=1;
  rect(cxs,by+bh*0.37,px(30),px(38),'#E0C089');
  x.beginPath();x.moveTo(cxs,by+bh*0.37);x.lineTo(cxs+px(9),by+bh*0.37);
  x.lineTo(cxs,by+bh*0.37+px(9));x.closePath();x.fillStyle='#120C08';x.fill();
  mono('SD',cxs+px(15),by+bh*0.37+px(16),'#1B2A3C',9,'center');
  x.restore();
  if(slid<0.9){x.save();x.globalAlpha=0.8;
    arrow(cxs-px(14),by+bh*0.50,cxs-px(46),by+bh*0.50,C.accent);x.restore()}
  mono('contacts face the board',bx+bw*0.5,by+bh+px(34),C.dim,11,'center');
  if(p>=2){x.save();x.globalAlpha=ease(clampP(p,2));
    wrapTxt('This card is the entire computer. The operating system, the program, and every reading you will ever take.',
      bx,by+bh+px(62),bw+px(120),C.accent,15,22);x.restore()}
};

/* ---- 3. power on: what alive looks like ---- */
SC.power=(p,t)=>{
  const bw=W*0.26,bx=W*0.50,by=H*0.34;
  const bh=board(bx,by,bw,null,true);
  const plugged=ease(clampP(p,0));
  /* cable */
  x.save();x.globalAlpha=plugged;
  x.strokeStyle='#5A6B7C';x.lineWidth=px(7);x.lineCap='round';
  x.beginPath();x.moveTo(bx-px(4),by+bh*0.50);
  x.bezierCurveTo(bx-px(90),by+bh*0.50,bx-px(70),by+bh+px(90),bx-px(150),by+bh+px(96));
  x.stroke();x.restore();
  mono('USB-C  5V',bx-px(150),by+bh+px(108),C.dim,10,'center');
  /* the LEDs */
  const lit=p>=1;
  for(let i=0;i<4;i++){
    const blink=lit?(0.35+0.65*Math.abs(Math.sin(t*2.2+i*0.9))):0.10;
    x.save();x.globalAlpha=blink;
    x.fillStyle=lit?C.good:'#3A2A1D';
    x.beginPath();x.arc(bx+bw*0.30+i*px(15),by+bh*0.72,px(3.4),0,7);x.fill();
    x.restore();
  }
  mono('4 status LEDs',bx+bw*0.30,by+bh*0.72+px(16),lit?C.good:C.dim,10);
  if(p>=2){
    const wait=Math.min(30,Math.floor((p-2)*30));
    x.save();x.globalAlpha=ease(clampP(p,2));
    mono('booting  '+String(wait).padStart(2,'0')+' s',bx+bw+px(40),by+bh*0.34,C.warm,16);
    wrapTxt('Nothing happens for about thirty seconds. That is normal. Linux is starting.',
      bx+bw+px(40),by+bh*0.34+px(30),W*0.20,C.mut,13,19);
    x.restore();
  }
};

/* ---- 4. counting pins ---- */
SC.counting=(p,t)=>{
  const x0=W*0.45, y0=H*0.30, sp=px(46);
  mono('P1 header, zoomed',x0,y0-px(34),C.dim,11);
  for(let n=1;n<=16;n++){
    const col=Math.ceil(n/2)-1, odd=(n%2===1);
    const cx=x0+px(30)+col*sp, cy=odd?y0:y0+px(52);
    const hi=(p>=2&&(n===14))||(p>=3&&(n===15));
    const col2=n===14?C.warm:(n===15?C.mut:'#6E5C46');
    x.fillStyle=hi?col2:'#8FA6B8';
    x.beginPath();x.arc(cx,cy,px(hi?7:5),0,7);x.fill();
    if(hi){x.save();x.globalAlpha=.3;x.beginPath();x.arc(cx,cy,px(15),0,7);
      x.fillStyle=col2;x.fill();x.restore()}
    if(p>=1)mono(String(n),cx,cy-px(6),hi?C.fg:C.dim,11,'center');
  }
  x.save();x.globalAlpha=.5;x.strokeStyle=C.line;x.lineWidth=px(1);
  x.beginPath();x.moveTo(x0+px(10),y0-px(20));x.lineTo(x0+px(10)+8*sp,y0-px(20));x.stroke();x.restore();
  mono('odd numbers, this row',x0+px(24),y0-px(18),C.dim,10);
  mono('even numbers, this row',x0+px(24),y0+px(72),C.dim,10);
  if(p>=1){x.save();x.globalAlpha=ease(clampP(p,1));
    wrapTxt('Pin 1 is at the end nearest the USB socket. Numbers zig-zag: odds along one row, evens along the other.',
      x0,y0+px(112),W*0.36,C.fg,15,22);x.restore()}
  if(p>=4){x.save();x.globalAlpha=ease(clampP(p,4));
    wrapTxt('Count in pairs. Seven pairs along, bottom row, is pin 14. The one above it is 15. Those two are your power and ground.',
      x0,y0+px(178),W*0.36,C.accent,15,22);x.restore()}
};

/* ---- 5. wires, one at a time ---- */
SC.wires=(p,t)=>{
  const bw=W*0.22,bx=W*0.435,by=H*0.28, hi={};
  const steps=[['P1_14','3V3',C.warm],['P1_15','GND',C.mut],
               ['P1_26','SDA',C.cool],['P1_28','SCL',C.good]];
  steps.forEach((s,i)=>{if(p>=i)hi[s[0]]=s[2]});
  const bh=board(bx,by,bw,hi,true);
  const mx=bx+bw+px(150);
  const lit={};steps.forEach((s,i)=>{if(p>=i)lit[s[1]]=s[2]});
  const pts=brk(mx,by+px(24),W*0.155,'BME280','0x76',C.cool,['3V3','GND','SCL','SDA'],lit);
  const order={'3V3':0,'GND':1,'SCL':2,'SDA':3};
  steps.forEach((s,i)=>{
    const on=ease(Math.min(1,Math.max(0,(p-i)*1.5)));
    if(on<=0)return;
    const n=parseInt(s[0].slice(3),10);
    const q=pinXY(bx,by,bw,bh,'P1',n), d=pts[order[s[1]]];
    wire(q[0],q[1],d[0],d[1]+px(26),s[2],on*0.95);
    mono(s[0]+'  \u2192  '+s[1],bx,by+bh+px(40)+i*px(24),s[2],12);
  });
  if(p>=4){x.save();x.globalAlpha=ease(clampP(p,4));
    wrapTxt('One wire at a time. Seat it, look at it, then pick up the next. Four wires done slowly is faster than four done twice.',
      bx,by+bh+px(150),W*0.34,C.accent,14,21);x.restore()}
};

/* ---- 6. the bus answers ---- */
SC.bus=(p,t)=>{
  const B=stageBox('$ sudo i2cdetect -y 1');
  const cols=8, rows=4, cw=px(40), chh=px(34);
  const gx=B.x+px(40), gy=B.y+px(56);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const val=r*cols+c;
    let label='--', col=C.dim;
    if(p>=1 && val===22){label='76';col=C.cool}
    if(p>=2 && val===12){label='3c';col=C.good}
    mono(label,gx+c*cw,gy+r*chh,col,14);
  }
  mono('the bus, scanned',B.x+px(40),gy-px(30),C.dim,11);
  if(p>=1){x.save();x.globalAlpha=ease(clampP(p,1));
    mono('76  your sensor',B.x+px(40),gy+rows*chh+px(24),C.cool,14);x.restore()}
  if(p>=2){x.save();x.globalAlpha=ease(clampP(p,2));
    mono('3c  your screen',B.x+px(40),gy+rows*chh+px(50),C.good,14);x.restore()}
  if(p>=3){x.save();x.globalAlpha=ease(clampP(p,3));
    wrapTxt('Two numbers in a field of dashes. That is your whole circuit, proved.',
      B.x+px(40),gy+rows*chh+px(88),B.w-px(90),C.accent,15,22);x.restore()}
  rail({title:'ON THE BUS',
    lines:p>=2?['0x76  BME280','0x3C  SSD1306']:(p>=1?['0x76  BME280','']:['','']),
    flag:p>=2?'2 devices':'scanning',flagOk:p>=2,
    meterName:'WIRES USED',hits:4,hitLabel:'of 4',
    logName:'ADDRESSES',entries:p>=2?2:(p>=1?1:0),
    note:'Every device answers to its own address.'},t);
};

const _bitmap={};
(function(){
  try{
    for(const k in IMG){
      if(!IMG[k])continue;
      const im=new Image();
      im.onload=()=>{_bitmap[k]=im};
      im.src=IMG[k];
    }
  }catch(e){/* no Image on this platform: fall back to plain fields */}
})();
/* cover-fit a photo, pushed back so type stays readable on top */
function photo(key,alpha,tint){
  const im=_bitmap[key];
  if(!im||!im.width)return false;
  const s=Math.max(W/im.width,H/im.height);
  const dw=im.width*s, dh=im.height*s;
  x.save();
  x.globalAlpha=alpha;
  try{x.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh)}catch(e){x.restore();return false}
  x.restore();
  if(tint){
    x.save();x.globalAlpha=.42;x.fillStyle=tint;x.fillRect(0,0,W,H);x.restore();
  }
  /* vignette, so the middle of the page is where the eye lands */
  const g=x.createRadialGradient(W*0.5,H*0.46,px(60),W*0.5,H*0.46,W*0.62);
  g.addColorStop(0,'rgba(8,13,22,0.25)');g.addColorStop(1,'rgba(8,13,22,0.94)');
  x.save();x.fillStyle=g;x.fillRect(0,0,W,H);x.restore();
  return true;
}

/* when a scene was first drawn, so typing runs in real time, not scroll time */
const ENTER={};
function sinceEnter(key,p,t){
  if(p<0.03||ENTER[key]===undefined)ENTER[key]=t;
  return Math.max(0,t-ENTER[key]);
}

/* the ladder: everything you can do, and the rung you are standing on */
function ladder(n,p,t){
  const lx=W*0.055, top=H*0.14, row=px(50);
  x.save();
  x.globalAlpha=.55;x.fillStyle=C.mut;
  x.font='700 '+px(10)+'px '+MONO;x.textAlign='left';x.textBaseline='top';
  x.fillText('WHAT YOU CAN DO',lx,top-px(26));
  for(let i=0;i<12;i++){
    const y=top+i*row, done=(i<n-1), now=(i===n-1);
    /* the rung */
    x.globalAlpha=now?0.95:(done?0.55:0.14);
    rect(lx,y+px(7),now?px(22):px(12),px(2.5),now?C.accent:(done?C.good:C.mut));
    /* the connector */
    if(i<11){x.globalAlpha=done?0.30:0.10;
      rect(lx+px(4),y+px(11),px(1.5),row-px(12),done?C.good:C.mut)}
    if(now){
      const pulse=RM?1:(0.55+0.45*Math.abs(Math.sin(t*1.8)));
      x.globalAlpha=pulse*0.22;x.fillStyle=C.accent;
      x.beginPath();x.arc(lx+px(4),y+px(8),px(13),0,7);x.fill();
    }
    x.globalAlpha=now?0.98:(done?0.62:0.18);
    x.fillStyle=now?C.fg:(done?C.mut:C.dim);
    x.font=(now?'700 ':'')+px(now?13:11)+'px '+SANS;
    x.fillText(KNOW[i][0],lx+px(34),y);
    if(now){
      x.globalAlpha=0.7;x.fillStyle=C.accent;
      x.font=px(10)+'px '+MONO;x.fillText(KNOW[i][1],lx+px(34),y+px(19));
    }
  }
  x.restore();
}

/* a question, typed out in front of you. everything else stops. */
function heroQ(n,p,t){
  const q=QS[n-1];
  /* the break: the landscape goes, and a desk arrives */
  x.save();x.globalAlpha=.97;x.fillStyle='#080D16';x.fillRect(0,0,W,H);x.restore();
  const hasPhoto=photo('typewriter',0.42,'#0C1830');
  if(!hasPhoto){
    /* no photograph loaded: a plain sheet, ruled, so the page still reads */
    x.save();x.globalAlpha=.05;x.strokeStyle=C.mut;x.lineWidth=px(1);
    for(let i=0;i<16;i++){x.beginPath();
      x.moveTo(W*0.18,H*0.16+i*px(46));x.lineTo(W*0.82,H*0.16+i*px(46));x.stroke()}
    x.restore();
  }

  ladder(n,p,t);
  const cx=W*0.60, maxw=W*0.52;
  const size=px(28), lh=px(43);
  const CPS=26;
  const el=RM?999:sinceEnter('q'+n,p,t);
  const shown=Math.floor(el*CPS);

  /* the label, struck first */
  const lab='QUESTION '+String(q[0]).padStart(2,'0')+' OF 12';
  const labN=Math.min(lab.length,shown);
  x.save();x.globalAlpha=.7;x.fillStyle=C.accent;
  x.font='700 '+px(13)+'px '+MONO;x.textAlign='center';x.textBaseline='top';
  x.fillText(lab.slice(0,labN),cx,H*0.26);x.restore();

  /* the question, one character at a time, wrapped in mono */
  x.font=px(size)+'px '+MONO;
  const words=q[1].split(' ');
  const lines=[''];
  words.forEach(w=>{
    const trial=lines[lines.length-1]?lines[lines.length-1]+' '+w:w;
    if(x.measureText(trial).width>maxw)lines.push(w);
    else lines[lines.length-1]=trial;
  });
  const body=Math.max(0,shown-lab.length-6);
  const top=H*0.35;
  let used=0, curX=null, curY=null;
  lines.forEach((ln,li)=>{
    const take=Math.max(0,Math.min(ln.length,body-used));
    used+=ln.length;
    if(take<=0)return;
    const s=ln.slice(0,take);
    x.save();x.globalAlpha=.96;x.fillStyle=C.fg;
    x.font=px(size)+'px '+MONO;x.textAlign='left';x.textBaseline='top';
    const lw=x.measureText(ln).width, lx=cx-lw/2;
    x.fillText(s,lx,top+li*lh);x.restore();
    curX=lx+x.measureText(s).width; curY=top+li*lh;
  });
  /* the cursor, blinking */
  if(curX!==null){
    const blink=RM?1:(Math.floor(t*2)%2?1:0.15);
    x.save();x.globalAlpha=blink*0.9;
    rect(curX+px(3),curY+px(4),px(13),size*0.86,C.accent);x.restore();
  }
  const doneTyping=(body>=lines.join('').length);

  /* the line you write on */
  if(doneTyping){
    const uo=cl01((el-(lab.length+lines.join('').length)/CPS)*1.1);
    x.save();x.globalAlpha=uo*0.35;
    rect(cx-maxw/2,top+lines.length*lh+px(34),maxw*uo,px(1.4),C.accent);x.restore();
    /* the rung you just reached */
    if(uo>0.5){
      x.save();x.globalAlpha=(uo-0.5)*2*0.9;
      x.textAlign='center';x.textBaseline='top';
      x.fillStyle=C.accent;x.font='700 '+px(10)+'px '+MONO;
      x.fillText('ANSWERING THIS PROVES YOU CAN',cx,top+lines.length*lh+px(52));
      x.fillStyle=C.fg;x.font='600 '+px(19)+'px '+SANS;
      x.fillText(KNOW[n-1][0],cx,top+lines.length*lh+px(72));
      x.restore();
    }
    /* what other students said, if anyone has */
    const R=RESPONSES[n]||[];
    const ry=top+lines.length*lh+px(118);
    x.save();
    if(R.length===0){
      x.globalAlpha=uo*0.55;x.fillStyle=C.dim;
      x.font=px(12)+'px '+MONO;x.textAlign='center';x.textBaseline='top';
      x.fillText('NO ANSWERS YET. YOU ARE THE FIRST COHORT.',cx,ry);
    } else {
      x.globalAlpha=uo*0.6;x.fillStyle=C.mut;
      x.font='700 '+px(11)+'px '+MONO;x.textAlign='center';x.textBaseline='top';
      x.fillText('WHAT OTHERS SAID',cx,ry);
      R.slice(0,3).forEach((r,i)=>{
        const yy=ry+px(26)+i*px(56);
        x.globalAlpha=uo*0.92;
        wrapTxt('\u201C'+r.a+'\u201D',cx-maxw*0.42,yy,maxw*0.84,C.fg,14,20);
        x.globalAlpha=uo*0.5;
        x.fillStyle=C.dim;x.font=px(11)+'px '+MONO;x.textAlign='left';
        x.fillText([r.who,r.where,r.year].filter(Boolean).join('  \u00B7  '),
                   cx-maxw*0.42,yy+px(34));
      });
    }
    x.restore();
  }
}

/* twelve answers make a full horizon. the mark closes as you go. */
function profileRing(done,p,t){
  const cx=W*0.5, cy=H*0.46, r=px(190);
  const on=ease(clampP(p,0));
  x.save();
  x.globalAlpha=on*0.16;x.strokeStyle=C.mut;x.lineWidth=px(10);
  x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();
  for(let i=0;i<12;i++){
    const a0=-Math.PI/2+(i/12)*Math.PI*2+0.028;
    const a1=-Math.PI/2+((i+1)/12)*Math.PI*2-0.028;
    const lit=i<done;
    x.globalAlpha=on*(lit?0.92:0.10);
    x.strokeStyle=lit?C.accent:C.mut;x.lineWidth=px(10);
    x.beginPath();x.arc(cx,cy,r,a0,a1);x.stroke();
    const am=(a0+a1)/2;
    x.globalAlpha=on*(lit?0.8:0.22);
    x.fillStyle=lit?C.fg:C.dim;
    x.font=px(11)+'px '+MONO;x.textAlign='center';x.textBaseline='middle';
    x.fillText(String(i+1),cx+Math.cos(am)*(r+px(24)),cy+Math.sin(am)*(r+px(24)));
  }
  x.globalAlpha=on;x.fillStyle=C.accent;
  x.font='700 '+px(76)+'px '+SANS;x.textAlign='center';x.textBaseline='middle';
  x.fillText(done+'/12',cx,cy-px(12));
  x.globalAlpha=on*0.7;x.fillStyle=C.mut;
  x.font=px(12)+'px '+MONO;x.fillText('SOVEREIGNTY PROFILE',cx,cy+px(40));
  const msg=done<4?'you can build one and prove it works':
           (done<7?'you can check what you were handed':
           (done<10?'you can say how wrong your instrument is':
                    'you can audit anything, and say what you would do'));
  x.globalAlpha=on*0.85;x.fillStyle=C.fg;
  x.font=px(15)+'px '+SANS;x.fillText(msg,cx,cy+px(66));
  x.restore();
  /* the three rungs this leg added, named */
  for(let i=done-3;i<done;i++){
    if(i<0)continue;
    const k=i-(done-3);
    const oo=ease(Math.min(1,Math.max(0,(p-0.6)*1.4-k*0.32)));
    if(oo<=0)continue;
    const y=cy+r+px(56)+k*px(30);
    x.save();x.globalAlpha=oo;
    x.textAlign='center';x.textBaseline='top';
    x.fillStyle=C.accent;x.font='700 '+px(11)+'px '+MONO;
    x.fillText('NEW',cx-px(150),y+px(3));
    x.fillStyle=C.fg;x.font='600 '+px(16)+'px '+SANS;
    x.fillText(KNOW[i][0],cx+px(10),y);
    x.restore();
  }
}

/* ---- 6a. Shiprock, New Mexico, 1965 ---- */
SC.shiprock=(p,t)=>{
  const cx=W*0.63, cy=H*0.32, s=W*0.15;
  /* a die, drawn as a woven grid: the two things the brochure compared */
  const n=12, cell=s/n;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const on=ease(Math.min(1,Math.max(0,p*1.1-(r+c)/(n*2.6))));
    if(on<=0)continue;
    const lit=((r*7+c*5)%9<3);
    x.save();x.globalAlpha=on*(lit?0.9:0.25);
    rect(cx-s/2+c*cell,cy-s/2+r*cell,cell-px(1.2),cell-px(1.2),
         lit?C.warm:'#6E5C46');
    x.restore();
  }
  frame(cx-s/2-px(6),cy-s/2-px(6),s+px(12),s+px(12),C.warm,px(1.2));
  mono('integrated circuit  /  weaving',cx,cy+s/2+px(22),C.mut,11,'center');

  const facts=[['1965','Fairchild opens a plant at Shiprock, on Navajo land',C.warm],
               ['1,000+','Navajo people employed at its height. mostly women.',C.accent],
               ['1969','the company brochure compares the work to weaving',C.cool],
               ['1975','the plant is occupied, then closed for good',C.bad]];
  facts.forEach((f,i)=>{
    const on=ease(Math.min(1,Math.max(0,(p-1)*1.3-i*0.34)));
    if(on<=0)return;
    const y=H*0.60+i*px(52);
    x.save();x.globalAlpha=on;
    x.fillStyle=f[2];x.font='700 '+px(21)+'px '+SANS;
    x.textAlign='left';x.textBaseline='top';x.fillText(f[0],W*0.44,y);
    mono(f[1],W*0.44+px(96),y+px(6),C.fg,12);
    x.restore();
  });
};

/* ---- 6b. 1918: a wire everyone could hear ---- */
SC.code=(p,t)=>{
  const wy=H*0.36, x1=W*0.44, x2=W*0.94;
  /* the line */
  x.save();x.globalAlpha=.8;x.strokeStyle='#8FA6B8';x.lineWidth=px(2);
  x.beginPath();x.moveTo(x1,wy);x.lineTo(x2,wy);x.stroke();x.restore();
  [[x1,'CHOCTAW','soldier, France',C.warm],[x2,'ALLIED','field HQ',C.good]].forEach(E=>{
    rect(E[0]-px(20),wy-px(16),px(40),px(32),'#132238');
    frame(E[0]-px(20),wy-px(16),px(40),px(32),E[3],px(1.4));
    x.save();x.globalAlpha=.9;x.strokeStyle=E[3];x.lineWidth=px(1.6);
    x.beginPath();x.arc(E[0],wy-px(16),px(11),Math.PI,0);x.stroke();x.restore();
    txt(E[1],E[0],wy+px(28),E[3],12,'600 ','center');
    mono(E[2],E[0],wy+px(46),C.dim,10,'center');
  });
  /* the message, travelling */
  const mv=ease(clampP(p,0));
  if(mv>0)for(let i=0;i<7;i++){
    const u=RM?0.5:((t*0.34+i*0.14)%1);
    x.save();x.globalAlpha=mv*(0.35+0.65*Math.sin(u*Math.PI));
    x.fillStyle=C.warm;x.beginPath();
    x.arc(x1+(x2-x1)*u,wy,px(3.2),0,7);x.fill();x.restore();
  }
  /* the tap */
  const tp=ease(clampP(p,1));
  if(tp>0){
    const tx=W*0.69, ty=wy+px(126);
    x.save();x.globalAlpha=tp;
    x.strokeStyle=C.bad;x.lineWidth=px(1.6);x.setLineDash([px(4),px(4)]);
    x.beginPath();x.moveTo(tx,wy+px(4));x.lineTo(tx,ty-px(20));x.stroke();x.restore();
    x.save();x.globalAlpha=tp;
    x.fillStyle=C.bad;x.beginPath();x.arc(tx,wy,px(5),0,7);x.fill();x.restore();
    rect(tx-px(56),ty-px(20),px(112),px(40),'#241018');
    frame(tx-px(56),ty-px(20),px(112),px(40),C.bad,px(1.4));
    txt('LISTENING POST',tx,ty-px(10),C.bad,11,'600 ','center');
    mono('every word, intercepted',tx,ty+px(28),C.bad,10,'center');
    /* what they heard */
    const heard=ease(clampP(p,2));
    if(heard>0){
      x.save();x.globalAlpha=heard;
      const junk=['Ç\u0416\u04D8\u2021\u00A4','\u01B7\u0426\u2021\u00D8\u0466','\u0466\u2021\u01B7\u00A4\u0416'];
      mono(junk[Math.floor(t*2)%3],tx,ty+px(2),C.mut,15,'center');
      x.restore();
    }
  }
  /* the three strategies */
  const st=ease(clampP(p,3));
  if(st>0){
    const rows=[['1918','the wire was tapped','the language could not be read',C.warm],
                ['your bus','anyone with a probe can read it','but the wire never leaves the box',C.accent],
                ['your card','no wire at all','nothing to intercept',C.good]];
    rows.forEach((r,i)=>{
      const on=ease(Math.min(1,Math.max(0,(p-3)*1.5-i*0.4)));
      if(on<=0)return;
      x.save();x.globalAlpha=on;
      const y=H*0.63+i*px(64);
      rect(W*0.44,y,px(4),px(46),r[3]);
      txt(r[0],W*0.44+px(18),y+px(6),r[3],15,'600 ');
      mono(r[1],W*0.44+px(18),y+px(28),C.fg,12);
      mono(r[2],W*0.70,y+px(28),C.mut,12);
      x.restore();
    });
  }
};

/* ---- 6c. 1890: the oldest recording in the world ---- */
SC.cylinder=(p,t)=>{
  const cx=W*0.64, cy=H*0.30, cw=W*0.17, chh=px(78);
  /* the wax cylinder, turning */
  x.save();
  rect(cx-cw/2,cy-chh/2,cw,chh,'#3A2C18');
  frame(cx-cw/2,cy-chh/2,cw,chh,'#7A5C30',px(1.4));
  const spin=RM?0:t*0.9;
  for(let i=0;i<26;i++){
    const u=((i/26)+spin*0.12)%1;
    x.globalAlpha=0.20+0.35*Math.sin(u*Math.PI);
    x.strokeStyle='#C79A50';x.lineWidth=px(1);
    x.beginPath();x.moveTo(cx-cw/2+u*cw,cy-chh/2+px(3));
    x.lineTo(cx-cw/2+u*cw,cy+chh/2-px(3));x.stroke();
  }
  x.restore();
  /* the stylus and the sound coming off it */
  x.save();x.globalAlpha=.8;x.strokeStyle=C.warm;x.lineWidth=px(2);
  x.beginPath();x.moveTo(cx+cw*0.18,cy-chh/2-px(26));x.lineTo(cx+cw*0.18,cy-chh/2);x.stroke();
  for(let k=0;k<3;k++){
    const ph=RM?0.4:((t*0.5+k*0.33)%1);
    x.globalAlpha=(1-ph)*0.5;
    x.beginPath();x.arc(cx+cw*0.18,cy-chh/2-px(26),px(12)+ph*px(52),-2.5,-0.6);x.stroke();
  }
  x.restore();
  mono('CALAIS, MAINE  MARCH 1890',cx,cy+chh/2+px(24),C.mut,11,'center');

  /* the journey: who held it, and for how long */
  const marks=[[1890,'recorded',C.warm,-1],[1970,'to Washington',C.mut,1],
               [1985,'first heard',C.cool,-1],
               [2016,'restored',C.good,1],[2019,'labelled by the tribe',C.accent,-1]];
  const tx0=W*0.44, tw=W*0.46, ty=H*0.60;
  x.save();x.globalAlpha=.4;x.strokeStyle=C.line;x.lineWidth=px(1.4);
  x.beginPath();x.moveTo(tx0,ty);x.lineTo(tx0+tw,ty);x.stroke();x.restore();
  marks.forEach((m,i)=>{
    const on=ease(Math.min(1,Math.max(0,p*1.25-i*0.30)));
    if(on<=0)return;
    const mx=tx0+tw*((m[0]-1890)/129);
    const up=m[3]<0;
    const align=(i>=3)?'right':'center';
    const ax=(i>=3)?mx+px(10):mx;
    x.save();x.globalAlpha=on;
    x.fillStyle=m[2];x.beginPath();x.arc(mx,ty,px(5),0,7);x.fill();
    x.globalAlpha=on*0.5;x.strokeStyle=m[2];x.lineWidth=px(1);
    x.beginPath();x.moveTo(mx,ty);x.lineTo(mx,ty+(up?-px(20):px(20)));x.stroke();
    x.globalAlpha=on;
    mono(String(m[0]),ax,ty+(up?-px(42):px(26)),m[2],12,align);
    mono(m[1],ax,ty+(up?-px(26):px(42)),C.mut,10,align);
    x.restore();
  });
  if(p>=4){x.save();x.globalAlpha=ease(clampP(p,4));
    wrapTxt('126 years in someone else\u2019s archive. The rights belonged to the man who brought the machine.',
      tx0,ty+px(84),W*0.32,C.accent,15,22);x.restore()}
};

/* ---- 12c. Te Hiku: a licence written from scratch ---- */
SC.reo=(p,t)=>{
  const x0=W*0.44, y0=H*0.20;
  /* a waveform of many voices */
  const wy=y0+px(40), ww=W*0.46;
  x.save();x.globalAlpha=.75;x.strokeStyle=C.accent;x.lineWidth=px(1.6);
  x.beginPath();
  for(let i=0;i<=160;i++){
    const u=i/160, ph=RM?0:t*1.1;
    const a=Math.sin(u*24+ph)*Math.sin(u*Math.PI)*px(26)
           +Math.sin(u*61-ph*0.7)*Math.sin(u*Math.PI)*px(11);
    i?x.lineTo(x0+ww*u,wy+a):x.moveTo(x0+ww*u,wy+a);
  }
  x.stroke();x.restore();
  const nums=[['2,500','people','who gave their voice'],
              ['300','hours','of labelled speech'],
              ['10','days','to collect all of it']];
  nums.forEach((n,i)=>{
    const on=ease(Math.min(1,Math.max(0,p*1.4-i*0.34)));
    if(on<=0)return;
    x.save();x.globalAlpha=on;
    const nx=x0+i*(W*0.155);
    x.fillStyle=C.accent;x.font='700 '+px(44)+'px '+SANS;
    x.textAlign='left';x.textBaseline='top';x.fillText(n[0],nx,y0+px(96));
    mono(n[1],nx,y0+px(150),C.fg,13);
    mono(n[2],nx,y0+px(170),C.mut,11);
    x.restore();
  });
  const terms=[['not owned, cared for','guardianship, not property',C.good],
               ['benefit flows back','to the people the data came from',C.cool],
               ['no surveillance use','written into the licence itself',C.warm]];
  terms.forEach((r,i)=>{
    const on=ease(Math.min(1,Math.max(0,(p-2)*1.4-i*0.34)));
    if(on<=0)return;
    x.save();x.globalAlpha=on;
    const y=y0+px(230)+i*px(56);
    rect(x0,y,px(4),px(40),r[2]);
    txt(r[0],x0+px(18),y+px(2),r[2],16,'600 ');
    mono(r[1],x0+px(18),y+px(24),C.mut,11);
    x.restore();
  });
};

/* ---- 7. when a number does not appear ---- */
SC.missing=(p,t)=>{
  const B=stageBox('nothing showed up. now what.');
  briefRows([['1','Is it powered','LEDs on? if not, the cable or the socket.',C.warm],
             ['2','Is every wire seated','half-in looks exactly like all-in.',C.cool],
             ['3','Are 3V3 and GND swapped','count the pins again, out loud.',C.good],
             ['4','Try the other address','some sensors answer at 0x77 instead of 0x76.',C.accent]],
    p,B.x+px(16),B.w-px(40),B.y+px(24),px(94));
};

/* ---- 8. verify the part ---- */
SC.verify=(p,t)=>{
  const B=stageBox('$ i2cget -y 1 0x76 0xD0');
  const lines=[['$ i2cget -y 1 0x76 0xD0',C.mut],['0x60',C.good],
    ['   BME280. temperature, pressure, humidity.',C.mut],['0x58',C.bad],
    ['   BMP280. no humidity. wrong part, right package.',C.bad]];
  const shown=Math.min(lines.length,Math.floor(p)+1);
  for(let i=0;i<shown;i++){
    const s2=(i===shown-1)?typed(lines[i][0],(p-i)*2.2,44):lines[i][0];
    mono(s2,B.x+px(18),B.y+px(30)+i*px(36),lines[i][1],15);
  }
  if(p>=4){x.save();x.globalAlpha=ease(clampP(p,4));
    wrapTxt('One register. One number. This is what checking instead of trusting looks like.',
      B.x+px(18),B.y+px(240),B.w-px(60),C.accent,16,24);x.restore()}
};
