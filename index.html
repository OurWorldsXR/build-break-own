/* ---- 10a. the sun's path: the whole sky is the diagram ---- */
SC.sunpath=(p,t)=>{
  const HZ=H*0.795, E=SKY('sunpath',p,t);
  const june=p<1.6, u=june?cl01(p/1.6):cl01((p-1.6)/1.6);
  const peak=june?0.86:0.30, col=june?C.warm:C.cool;
  const sunX=W*(0.06+E.az*0.88), sunY=HZ-E.alt*HZ*0.94;
  /* the arc it is travelling */
  x.save();x.globalAlpha=.34;x.strokeStyle=col;x.lineWidth=px(1.4);
  x.setLineDash(june?[]:[px(6),px(6)]);
  x.beginPath();
  for(let i=0;i<=64;i++){const v=i/64;
    const xx=W*(0.06+(0.04+v*0.92)*0.88), yy=HZ-arc(v,peak)*HZ*0.94;
    i?x.lineTo(xx,yy):x.moveTo(xx,yy);}
  x.stroke();x.restore();
  /* the ghost of the other season */
  x.save();x.globalAlpha=.13;x.strokeStyle=june?C.cool:C.warm;x.lineWidth=px(1.2);
  x.setLineDash([px(4),px(8)]);x.beginPath();
  for(let i=0;i<=64;i++){const v=i/64;
    const xx=W*(0.06+(0.04+v*0.92)*0.88), yy=HZ-arc(v,june?0.30:0.86)*HZ*0.94;
    i?x.lineTo(xx,yy):x.moveTo(xx,yy);}
  x.stroke();x.restore();
  /* the station, standing on the real ground */
  const stx=W*0.63;
  rect(stx-px(4),HZ-px(30),px(8),px(30),'#8FA6B8');
  for(let i=0;i<4;i++)rect(stx-px(16),HZ-px(34)-i*px(6),px(32),px(3),'#EFF4F8');
  /* the ray that is actually arriving, right now */
  if(E.alt>0.01){
    x.save();x.globalAlpha=.55;x.strokeStyle=col;x.lineWidth=px(1.6);
    x.setLineDash([px(4),px(6)]);
    x.beginPath();x.moveTo(sunX,sunY);x.lineTo(stx,HZ-px(36));x.stroke();x.restore();
    /* the station's shadow, long when the sun is low */
    const dir=(sunX>stx)?-1:1, len=px(14)+(1-cl01(E.alt/0.5))*px(150);
    x.save();x.globalAlpha=.30;x.fillStyle='#0A0E1C';
    x.beginPath();x.moveTo(stx-px(4),HZ);x.lineTo(stx+px(4),HZ);
    x.lineTo(stx+dir*len+px(10),HZ+px(9));x.lineTo(stx+dir*len,HZ+px(9));
    x.closePath();x.fill();x.restore();
  }
  /* the readout */
  const deg=Math.round(Math.asin(cl01(E.alt))*180/Math.PI);
  const bx=W*0.44, by=H*0.14;
  x.save();x.globalAlpha=.9;
  mono(june?'JUNE':'DECEMBER',bx,by,col,13);
  mono(String(deg).padStart(2,'0')+'\u00B0 above the horizon',bx,by+px(22),C.fg,15);
  mono(june?'light arrives from overhead':'light arrives sideways',bx,by+px(44),C.mut,12);
  x.restore();
  if(p>=3.2){x.save();x.globalAlpha=ease(clampP(p,3.2));
    wrapTxt('Same ground, same instrument, two different suns. A cover that works in June lets December straight in underneath.',
      bx,by+px(76),W*0.32,C.accent,15,22);x.restore()}
};

/* ---- 10b. the shield, tested against three angles ---- */
SC.shield=(p,t)=>{
  const cx=W*0.60,top=H*0.24,sw=W*0.155,gap=px(34);
  /* rod */
  x.strokeStyle='#8FA6B8';x.lineWidth=px(3);
  x.beginPath();x.moveTo(cx,top-px(8));x.lineTo(cx,top+gap*4+px(14));x.stroke();
  /* saucers */
  for(let i=0;i<5;i++){
    const on=ease(Math.min(1,Math.max(0,p*1.6-i*0.16)));
    if(on<=0)continue;
    const y=top+i*gap;
    x.save();x.globalAlpha=on;x.fillStyle='#EFF4F8';
    x.beginPath();x.moveTo(cx-sw/2,y+px(10));
    x.quadraticCurveTo(cx,y-px(10),cx+sw/2,y+px(10));
    x.lineTo(cx+sw/2,y+px(17));
    x.quadraticCurveTo(cx,y-px(3),cx-sw/2,y+px(17));
    x.closePath();x.fill();x.restore();
    if(i>0&&i<4&&on>0.6){x.save();x.globalAlpha=(on-0.6)/0.4*0.9;
      rect(cx-px(13),y+px(4),px(26),px(4),'#0D1626');x.restore()}
  }
  /* the sensor */
  const so=ease(clampP(p,1));
  if(so>0){x.save();x.globalAlpha=so;
    rect(cx-px(24),top+gap*2-px(2),px(48),px(18),'#4FA383');
    mono('BME280',cx,top+gap*2+px(2),C.fg,9,'center');x.restore()}
  /* three test rays, each stopped by an edge */
  const rays=[[-1.15,C.warm,'June noon, overhead'],
              [-0.62,C.accent,'spring afternoon'],
              [-0.16,C.cool,'December, low and sideways']];
  rays.forEach((r,k)=>{
    const on=ease(clampP(p,2+k*0.5));
    if(on<=0)return;
    const ang=r[0], L=W*0.20;
    const ty=top+gap*(k===0?0:(k===1?1:3))+px(8);
    const tx=cx-sw/2;
    x.save();x.globalAlpha=on*0.85;x.strokeStyle=r[1];x.lineWidth=px(1.8);
    x.beginPath();x.moveTo(tx-Math.cos(ang)*L,ty-Math.sin(ang)*L*-1);
    x.lineTo(tx,ty);x.stroke();
    /* stopped marker */
    x.globalAlpha=on;x.fillStyle=r[1];
    x.beginPath();x.arc(tx,ty,px(4.5),0,7);x.fill();
    x.restore();
    mono(r[2],cx-sw/2-px(150),ty+px(2),r[1],10);
  });
  if(p>=4){x.save();x.globalAlpha=ease(clampP(p,4));
    wrapTxt('Every angle is stopped by an edge. The gaps are 20 mm because that is wide enough for air and narrow enough for December.',
      cx-sw/2-px(150),top+gap*4+px(58),W*0.32,C.accent,15,22);x.restore()}
};

/* ---- 10c. the proof: one day, two sensors ---- */
SC.proof=(p,t)=>{
  const B=stageBox('one clear day, both sensors logging');
  const gx=B.x+px(50), gy=B.y+px(52), gw=B.w-px(110), gh=px(230);
  /* axes */
  x.save();x.globalAlpha=.45;x.strokeStyle=C.line;x.lineWidth=px(1);
  x.beginPath();x.moveTo(gx,gy);x.lineTo(gx,gy+gh);x.lineTo(gx+gw,gy+gh);x.stroke();x.restore();
  ['00','06','12','18','24'].forEach((L,i)=>
    mono(L,gx+gw*i/4,gy+gh+px(10),C.dim,10,'center'));
  mono('degrees C',gx-px(44),gy-px(4),C.dim,10);
  /* solar noon marker */
  x.save();x.globalAlpha=.30;x.setLineDash([px(4),px(6)]);
  x.strokeStyle=C.warm;x.lineWidth=px(1);
  x.beginPath();x.moveTo(gx+gw*0.5,gy);x.lineTo(gx+gw*0.5,gy+gh);x.stroke();x.restore();
  mono('solar noon',gx+gw*0.5+px(8),gy+px(2),C.warm,10);
  const curve=(f,col,al,lw)=>{
    x.save();x.globalAlpha=al;x.strokeStyle=col;x.lineWidth=px(lw||2);
    x.beginPath();
    for(let i=0;i<=96;i++){const u=i/96;
      const yy=gy+gh-f(u)*gh;
      i?x.lineTo(gx+gw*u,yy):x.moveTo(gx+gw*u,yy);}
    x.stroke();x.restore();
  };
  const air=u=>0.30+0.34*Math.sin((u-0.25)*Math.PI*2);
  const bump=u=>Math.exp(-Math.pow((u-0.5)/0.085,2));
  if(p>=0)curve(air,C.good,0.95);
  if(p>=1)curve(u=>air(u)+0.30*bump(u),C.bad,0.95);
  if(p>=2)curve(u=>air(u)+0.035*bump(u),C.accent,0.95,2.4);
  const key=[[C.good,'true air temperature',0],[C.bad,'bare sensor, no shield',1],
             [C.accent,'inside the shield',2]];
  key.forEach((k,i)=>{
    if(p<k[2])return;
    x.save();x.globalAlpha=ease(clampP(p,k[2]));
    rect(gx,gy+gh+px(34)+i*px(24),px(20),px(3),k[0]);
    mono(k[1],gx+px(30),gy+gh+px(28)+i*px(24),k[0],12);
    x.restore();
  });
  if(p>=3){x.save();x.globalAlpha=ease(clampP(p,3));
    wrapTxt('If your line spikes at midday and drops again, sun is reaching the sensor. That hump is the whole test.',
      gx+gw*0.42,gy+gh+px(30),B.w-gw*0.42-px(70),C.warm,14,21);x.restore()}
};

/* ---- 11b. DataBack ---- */
SC.databack=(p,t)=>{
  const x0=W*0.44;
  const words=[['LAND','BACK','land returned to the nations it was taken from',C.good],
               ['DATA','BACK','and the record of all of it',C.accent]];
  words.forEach((w,i)=>{
    const on=ease(Math.min(1,Math.max(0,p*1.3-i*0.36)));
    if(on<=0)return;
    const y=H*0.22+i*px(100), lit=(i===1);
    x.save();x.globalAlpha=on*(lit?1:0.42);
    x.textAlign='left';x.textBaseline='top';
    x.font='700 '+px(50)+'px '+SANS;
    x.fillStyle=lit?C.fg:C.mut;x.fillText(w[0],x0+(1-on)*px(20),y);
    const gap=x.measureText(w[0]+' ').width;
    x.fillStyle=w[3];x.fillText(w[1],x0+gap+(1-on)*px(20),y);
    x.globalAlpha=on*(lit?0.9:0.35);
    mono(w[2],x0,y+px(58),C.mut,11);
    x.restore();
  });
  /* a belt: rows of beads, a data format older than paper */
  const bo=ease(clampP(p,3));
  if(bo>0){
    const bx=x0, by=H*0.60, bw=W*0.45, rows=5, cols=44;
    const cw=bw/cols, chh=px(11);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const band=(c>10&&c<15)||(c>21&&c<25)||(c>31&&c<35);
      const dark=band?(r>0&&r<4):!(r===0||r===rows-1);
      x.save();x.globalAlpha=bo*(dark?0.88:0.55);
      x.fillStyle=dark?'#3E3560':'#EDE6D8';
      x.beginPath();
      x.ellipse(bx+c*cw+cw/2,by+r*chh+chh/2,cw*0.36,chh*0.38,0,0,7);
      x.fill();x.restore();
    }
    x.save();x.globalAlpha=bo*0.85;
    mono('reading one of these properly can take a week',bx,by+rows*chh+px(16),C.mut,11);
    x.restore();
  }
};

/* ---- 12a. CARE: the standard Indigenous nations wrote ---- */
SC.care=(p,t)=>{
  const x0=W*0.44, y0=H*0.22;
  const rows=[['C','Collective Benefit','the data should serve your community first',C.good],
              ['A','Authority to Control','your nation decides who gets it, and when',C.accent],
              ['R','Responsibility','whoever holds it must show how it helped',C.warm],
              ['E','Ethics','the rights of the people it is about come first',C.cool]];
  rows.forEach((r,i)=>{
    const on=ease(Math.min(1,Math.max(0,p*1.3-i*0.32)));
    if(on<=0)return;
    const y=y0+i*px(96), sl=(1-on)*px(40);
    x.save();x.globalAlpha=on;
    x.fillStyle=r[3];x.font='700 '+px(58)+'px '+SANS;
    x.textAlign='left';x.textBaseline='top';x.fillText(r[0],x0-sl,y-px(8));
    txt(r[1],x0+px(64),y+px(4),C.fg,20,'600 ');
    mono(r[2],x0+px(64),y+px(38),C.mut,12);
    x.restore();
  });
  const fo=ease(clampP(p,4));
  if(fo>0){
    x.save();x.globalAlpha=fo*0.85;
    const fy=y0+px(400);
    mono('FAIR  asks: can the data be found, opened, reused?',x0,fy,C.dim,12);
    mono('CARE  asks: who benefits, and who decides?',x0,fy+px(22),C.accent,12);
    x.restore();
  }
};

/* ---- 12b. spectrum: the airwaves over your own land ---- */
SC.spectrum=(p,t)=>{
  const HZ=H*0.795, tx=W*0.66;
  /* the mast */
  x.save();x.strokeStyle='#B9CBD8';x.lineWidth=px(2.4);
  x.beginPath();x.moveTo(tx,HZ);x.lineTo(tx,HZ-px(150));x.stroke();
  x.lineWidth=px(1.4);
  x.beginPath();x.moveTo(tx-px(20),HZ);x.lineTo(tx,HZ-px(150));
  x.lineTo(tx+px(20),HZ);x.stroke();x.restore();
  /* signal going out over the land */
  const on=ease(clampP(p,0));
  for(let k=0;k<5;k++){
    const ph=RM?(0.2+k*0.18):((t*0.30+k*0.20)%1);
    x.save();x.globalAlpha=on*(1-ph)*0.55;
    x.strokeStyle=C.accent;x.lineWidth=px(1.6);
    x.beginPath();x.arc(tx,HZ-px(150),px(30)+ph*px(300),-Math.PI*0.92,-Math.PI*0.08);
    x.stroke();x.restore();
  }
  mono('2.5 GHz, licensed to the nation',tx,HZ+px(22),C.mut,11,'center');
  /* the count */
  const co=ease(clampP(p,1));
  if(co>0){
    x.save();x.globalAlpha=co;
    const bx=W*0.44, by=H*0.20;
    mono('applications the FCC expected',bx,by,C.dim,11);
    x.fillStyle=C.mut;x.font='700 '+px(46)+'px '+SANS;
    x.textAlign='left';x.textBaseline='top';x.fillText('10',bx,by+px(16));
    x.restore();
  }
  const c2=ease(clampP(p,2));
  if(c2>0){
    x.save();x.globalAlpha=c2;
    const bx=W*0.44, by=H*0.36;
    mono('applications that arrived',bx,by,C.dim,11);
    const n=Math.round(10+390*c2);
    x.fillStyle=C.accent;x.font='700 '+px(78)+'px '+SANS;
    x.textAlign='left';x.textBaseline='top';x.fillText(String(n),bx,by+px(16));
    x.restore();
  }
};

/* ---- 11. the trace ---- */
SC.trace=(p,t)=>{
  const x0=W*0.415,w=W*0.515,colw=(w-px(40))/2,rx=x0+colw+px(40);
  txt('YOUR STATION',x0+colw/2,H*0.19,C.good,14,'600 ','center');
  txt('YOUR PHONE',rx+colw/2,H*0.19,C.mut,14,'600 ','center');
  [['CHIP','TI AM6254','?'],['FIRMWARE','open, published','?'],
   ['OS','you built it','?'],['DATA','the card in your hand','?']].forEach((r,i)=>{
    const on=Math.min(1,Math.max(0,p*1.4-i*0.34)),y=H*0.28+i*px(102);
    if(on<=0)return;
    x.save();x.globalAlpha=.12+on*.88;
    const sl=(1-ease(on))*px(56);
    mono(r[0],x0,y-px(13),C.dim,11);
    card(x0-sl,y,colw,px(64),C.good);
    txt(r[1],x0+px(16)-sl,y+px(21),C.fg,16,'600 ');
    card(rx+sl,y,colw,px(64),C.line);
    txt(r[2],rx+colw/2+sl,y+px(18),C.bad,26,'700 ','center');
    x.restore();
  });
};

SC.closing=(p,t)=>{
  ring360(W*0.5,H*0.46,px(290),0.55,t);
  wordmark(W*0.5,H*0.80,14,C.mut,.85);
};

/* ================= BEATS ================= */
const BEATS=[
{s:'opening',talk:1,side:'full',html:``},
{s:'opening',talk:1,side:'wide',html:`<h1>Build It, Break It, Own It</h1>
  <p class="lede" style="margin:0 auto">Your first computer build, step by step. No experience needed. Nothing here breaks if you get it wrong.</p>
  <div class="meta"><span>OurWorlds. Historical narratives of Native America in mixed reality.</span>
  <span>Built on BeagleBoard hardware. AISES National Conference, Portland, October 2026.</span></div>`},

{s:'replica',talk:1,side:'left',html:`<div class="kick">before anything else</div>
  <h2>Look at this for a minute</h2>
  <p>It is a rug. Wool from Navajo-Churro sheep, spun by hand, thinner than the weaver normally spins it. And it is a photograph of a computer chip, accurate enough that an engineer recognised which one.</p>`},
{s:'replica',side:'left',html:`<p><span class="a">Replica of a Chip</span>, woven by Marilou Schultz in 1994. She is Diné, a fourth generation weaver, and a mathematics teacher.</p>`},
{s:'replica',side:'left',html:`<p>The chip is Intel's Pentium. Three million transistors on a piece of silicon the size of a fingernail, and she put every block of it on a loom.</p>`},
{s:'replica',side:'left',html:`<p>Traditional Navajo weaving leans on symmetry. A chip layout has none. So there was no shortcut and nothing to repeat, and the work went at about <span class="a">one inch a day</span>.</p>`},
{s:'replica',side:'left',html:`<p>Accurate enough that thirty years later a computer historian walked past it in a gallery, stopped, and worked out which chip it was.</p>`},
{s:'replica',talk:1,side:'left',html:`<p>Intel commissioned it as a gift to AISES. <span class="a">It was made for the people in this room.</span> Thirty-two years later you are sitting at their conference, about to build a computer.</p>`},
{s:'replica',talk:1,side:'left',html:`<p>Hold onto one thing as you start. A company once used weaving as a way of explaining why Navajo women were good at cheap assembly work. Schultz took the same comparison, and made the chip <span class="a">the thing being woven</span>. Same two crafts. Completely different hands on the frame.</p>
  <div class="meta"><span>Replica of a Chip, 1994. Marilou Schultz (Diné). Wool, 120 x 146.1 cm.</span>
  <span>Commissioned by Intel as a gift to the American Indian Science and Engineering Society. Reproduced with the artist's permission.</span></div>`},

{s:'paths',talk:1,side:'left',html:`<div class="kick">start here</div>
  <h2>Two ways in</h2>
  <p>The same nine steps, read two different ways. Pick the one that matches why you opened this.</p>`},
{s:'paths',side:'left',html:`<p><span class="a">Press B for the build path.</span> Twenty minutes, hands only. Everything you need to get a station working and nothing you do not. This is the one to use at a workshop table.</p>
  <p style="margin-top:1rem"><span class="a">Press K to pick your kit.</span> Kit A has a breadboard and runs the sensor and screen together. Kit B has no breadboard and wires one module straight to the board. The bag decides; the steps below change to match. You are on <span class="kitA">Kit A</span><span class="kitB">Kit B</span>.</p>
  <p style="margin-top:1rem"><a href="worksheet.html">Print the worksheet</a> first. Four pages, and it works with no power at all.</p>`},
{s:'paths',side:'left',html:`<p><span class="a">Press T for the full tour.</span> Forty minutes. The same build, plus where the chips were made, what happened in France in 1918, and what a wax cylinder has to do with your weather data.</p>`},
{s:'paths',side:'left',html:`<p>Or scroll straight through for all of it, about an hour. The route only changes what is emphasised. Nothing is hidden, and the worksheet is the same either way.</p>
  <p style="margin-top:1rem">Teaching it? The <a href="teacher-guide.html">teacher guide</a> has the standards, three session lengths, and where students get stuck. The station image and its build script are in <a href="https://github.com/OurWorldsXR/build-break-own/tree/main/sovereign-weather-station">sovereign-weather-station</a>.</p>`},
{s:'paths',talk:1,side:'left',html:`<p><span class="a">Teachers.</span> Read the teacher guide alongside this. It has the standards this unit meets, three session lengths, the six artifacts you can collect, and the three places students reliably get stuck.</p>
  <div class="meta"><span>CSTA 3A-CS-01, 3A-CS-02, 3A-CS-03, 3A-DA-09, 3A-DA-10, 3A-NI-07.</span>
  <span>NGSS HS-ETS1-2 and HS-ETS1-3, with SEP and CCC noted per section.</span></div>`},

{s:'journey',talk:1,side:'left',html:`<div class="kick">the whole road</div>
  <h2>Three movements</h2>
  <p>Here is everything before you start, so you always know where you are. A marker in the top corner tells you which movement you are in and how far through.</p>`},
{s:'journey',side:'left',html:`<p><span class="a">Build it.</span> Six stops. You end holding a working instrument that you assembled and proved, from parts, without help.</p>`},
{s:'journey',side:'left',html:`<p><span class="a">Break it.</span> Five stops. Not breaking the device. Breaking the assumption that somebody else already settled who controls it. Shiprock, France, Maine, a register, and the sun.</p>`},
{s:'journey',side:'left',html:`<p><span class="a">Own it.</span> Four stops. Nobody has finished this part, anywhere. There is a live argument going on right now about what sovereignty means when it is made of hardware, and you are about to be in it.</p>`},
{s:'journey',talk:1,side:'left',html:`<p>Each movement ends with a checkpoint: three questions on your sheet. Twelve in total. The last three have no answer key, because nobody has agreed on them yet.</p>`},

{s:'land',talk:1,side:'full',html:``},
{s:'land',talk:1,side:'wide',html:`<p class="lede" style="margin:0 auto">Temperature, humidity, pressure. Your homeland is producing these numbers right now. Somebody is already collecting them.</p>`},

{s:'kit',talk:1,build:1,side:'left',html:`<div class="kick">step one</div>
  <h2>Tip the bag out</h2>
  <p><span class="kitbadge"><span class="kitA">Kit A</span><span class="kitB">Kit B</span></span> Lay everything on the table in front of you and leave it there. Board at the bottom with its USB-C port on the <span class="a">left</span>; modules above it, pins toward you; wires sorted by colour.</p>
  <img class="kitA" src="sovereign-weather-station/images/kit-A.svg" alt="Kit A: board, mini breadboard, cable, card, sensor, screen, clock, twelve wires">
  <img class="kitB" src="sovereign-weather-station/images/kit-B.svg" alt="Kit B: board, cable, card, sensor, screen, four wires">`},
{s:'kit',side:'left',html:`<p>The <span class="a">computer</span> is the black board with two strips of sockets along its long edges. It is the size of a stick of gum. It runs Linux, the same operating system that runs most of the internet.</p>`},
{s:'kit',side:'left',html:`<p>The <span class="a">card</span> is smaller than your fingernail. Do not lose it. Everything the computer knows lives on it.</p>`},
{s:'kit',side:'left',html:`<p>The <span class="a">sensor</span> is the small purple board with four legs. It reads the air. The legs are labelled in tiny letters: VIN, GND, SCL, SDA.</p>`},
{s:'kit',side:'left',html:`<p>The <span class="a">screen</span> is the little glass rectangle. Four legs as well, and the order of the first two, VCC and GND, differs between makers. <span class="a">Read yours and write it down now.</span> Backwards is the one mistake that kills a part.</p>`},
{s:'kit',talk:1,build:1,side:'left',html:`<p class="kitA">Then the <span class="a">breadboard</span>, a slab of 170 holes, and <span class="a">twelve wires</span> with a pin at both ends. Count the wires now. If you have eleven, get another one before you start.</p>
  <p class="kitB">Then <span class="a">four wires</span> with a pin at one end and a socket at the other. Pin end goes into the board; socket end slides over a module leg. No breadboard in this kit, so the sensor and the screen take turns.</p>`},

{s:'why',talk:1,side:'left',html:`<div class="kick">before you start</div>
  <h2>Why this computer</h2>
  <p>There are cheaper boards. There are boards with more tutorials. We picked this one for a reason you will need in about an hour.</p>`},
{s:'why',side:'left',html:`<p>BeagleBoard.org is a <span class="a">non-profit foundation</span>, registered in Michigan. Not a company. There are no shareholders waiting on a return, which changes what it is allowed to care about.</p>`},
{s:'why',side:'left',html:`<p>Its stated job is education in and collaboration around open source software and hardware. That is the charter. Not a mission statement bolted onto a business.</p>`},
{s:'why',side:'left',html:`<p>And they publish everything. The full schematic. The board layout. The list of every component. Enough that you could have this board made yourself, by someone else, without asking them.</p>`},
{s:'why',talk:1,side:'left',html:`<p>Hold onto that. In an hour you will trace who controls each layer of this machine, and then try the same on your phone. <span class="a">That exercise only works because somebody published the answers.</span> Most companies do not.</p>`},
{s:'why',talk:1,side:'left',html:`<p>They also paid for the board in front of you. The BeagleBoard.org Foundation sponsored every station in this room, for a workshop that spends its second half asking hard questions about who controls hardware. <span class="a">Wado.</span></p>`},

{s:'freedoms',talk:1,side:'left',html:`<div class="kick">the rules underneath</div>
  <h2>Four freedoms</h2>
  <p>Open source is not "free as in no money". It is a specific list, written down in the 1980s, of four things you are allowed to do with a piece of software. Hardware borrowed the same list.</p>`},
{s:'freedoms',side:'left',html:`<p><span class="a">Freedom zero.</span> Run it for any purpose you have. Not the purpose the maker had in mind. Yours.</p>`},
{s:'freedoms',talk:1,side:'left',html:`<p><span class="a">Freedom one.</span> Study how it works, and change it. Access to the source is a precondition, because you cannot study what you are not allowed to read.</p>`},
{s:'freedoms',side:'left',html:`<p><span class="a">Freedom two.</span> Give a copy to someone else. <span class="a">Freedom three.</span> Give away your changed version, so your fix becomes everybody's fix.</p>`},
{s:'freedoms',talk:1,side:'left',html:`<p>Freedom one is the one this workshop stands on. Every question you are about to answer about who controls this board is answerable <span class="a">only because somebody published the answer</span>. On most hardware, freedom one does not exist.</p>`},

{s:'card',talk:1,build:1,side:'left',html:`<div class="kick">step two</div>
  <h2>The card goes in first</h2>
  <p>Before power. Before wires. The slot is on the socket side of the board, next to the USB-C end, under the big metal plate.</p>`},
{s:'card',side:'left',html:`<p>Label facing out, away from the board. Push until it clicks. It should sit almost flush. If it sticks out, it is the wrong way round.</p>`},
{s:'card',talk:1,build:1,side:'left',html:`<p>You are holding the whole computer in your hand. Move this card to another board and your station moves with it.</p>`},

{s:'power',talk:1,build:1,side:'left',html:`<div class="kick">step three</div>
  <h2>Now plug it in</h2>
  <p>USB-C. The same connector as a phone charger. It only fits one way, so you cannot get this wrong.</p>`},
{s:'power',side:'left',html:`<p>Small lights come on. They are on the underside, the side without sockets, so you see a glow at the USB-C end rather than the lights themselves. One flickers unevenly. That is the card being read. Flickering is good.</p>`},
{s:'power',talk:1,build:1,side:'left',html:`<p>Then wait. <span class="a">Nothing visible happens for about forty seconds.</span> The computer is starting up. This is the moment most people decide it is broken. It is not. <span class="kitA">Then the screen lights, on its own.</span></p>`},

{s:'counting',talk:1,build:1,side:'left',html:`<div class="kick">step four</div>
  <h2>How to find one socket out of seventy-two</h2>
  <p>Both long edges are lined with sockets. They look identical. They are not. There is a system.</p>
  <img src="sovereign-weather-station/images/board-pins.svg" alt="The PocketBeagle 2 with P1.14, P1.15, P1.26 and P1.28 marked, and every P1 socket numbered">`},
{s:'counting',side:'left',html:`<p>Hold the board sockets up. The strip with a tiny printed <span class="a">1</span> and <span class="a">2</span> at the USB-C end is P1. From there the numbers zig-zag: odd numbers along the outer row, evens along the inner row.</p>`},
{s:'counting',side:'left',html:`<p>To find <span class="a">pin 14</span>, count sockets along the inner row from the USB-C end: 2, 4, 6, 8, 10, 12, 14. Seven sockets.</p>`},
{s:'counting',side:'left',html:`<p><span class="a">Pin 15</span> is the next one along on the outer row, diagonal from 14. <span class="a">26</span> and <span class="a">28</span> are the 13th and 14th along the inner row. And the corner socket by the USB-C port, outer row, is pin 1: five volts. Nothing ever goes in it.</p>`},
{s:'counting',talk:1,build:1,side:'left',html:`<p>Count out loud. Count twice. Almost every mistake in this build is a miscounted pin.</p>`},

{s:'wires',talk:1,build:1,side:'left',html:`<div class="kick">step five</div>
  <h2>Four wires, one at a time</h2>
  <p>Unplug the board first. Never move a wire while it has power. That is the one action that can permanently damage it.</p>
  <img class="kitA" src="sovereign-weather-station/images/bench-A-step4.svg" alt="Kit A: sensor and screen in the mini breadboard, four shared columns, four wires from the board">
  <img class="kitB" src="sovereign-weather-station/images/bench-B-step1.svg" alt="Kit B: four wires from the board straight to the sensor">`},
{s:'wires',side:'left',html:`<p class="kitA">Seat the sensor in the breadboard's top row, columns 1 to 4, and the screen in columns 9 to 12. Columns 14 to 17 stay empty: they become the four shared wires. First wire: <span class="a">pin 14 to column 14</span>. That is the power line. It carries 3.3 volts. The modules do not survive 5.</p>
  <p class="kitB">First wire: <span class="a">pin 14 to VIN</span> on the sensor. Pin end in the board, socket end over the leg. This is the power line. It carries 3.3 volts. The sensor does not survive 5.</p>`},
{s:'wires',side:'left',html:`<p>Second: <span class="a">pin 15 to <span class="kitA">column 15</span><span class="kitB">GND</span></span>. Ground is the shared floor everything is measured against.</p>`},
{s:'wires',side:'left',html:`<p>Third: <span class="a">pin 26 to <span class="kitA">column 16</span><span class="kitB">SDA</span></span>. This one carries the actual readings.</p>`},
{s:'wires',side:'left',html:`<p>Fourth: <span class="a">pin 28 to <span class="kitA">column 17</span><span class="kitB">SCL</span></span>. A clock, ticking, so both ends agree on when to listen.</p>`},
{s:'wires',talk:1,build:1,side:'left',html:`<p class="kitA">Now the sensor's four legs to the same four columns, and the screen's four legs too, in the order printed on your screen. Red ends at VIN or VCC, black at GND, every time. Two devices, one set of wires. That is the whole trick of how this works.</p>
  <p class="kitB">The screen would go to the same four pins, and it will, after the sensor has answered: unplug, move the four wires across, plug in again. Two devices, one set of wires, taking turns. With a breadboard they would share.</p>`},

{s:'bus',talk:1,build:1,side:'left',html:`<div class="kick">step six</div>
  <h2>Ask what is out there</h2>
  <p>Plug the power back in. Wait for the boot. On the laptop, <code>ssh student@192.168.7.2</code> (Mac: <code>192.168.6.2</code>), password <code>buildit</code>. Then one command: <code>sws-check</code>. It calls out across the wires and tells you in plain words what answered. The long way is <code>sudo i2cdetect -y -r 2</code>, a grid of dashes.</p>`},
{s:'bus',side:'left',html:`<p>In the grid almost everything comes back as a dash, meaning nothing there. Then <span class="a">76</span> appears. That is your sensor. It just told you its address.</p>`},
{s:'bus',side:'left',html:`<p><span class="kitA">And <span class="a">3c</span>. That is your screen.</span><span class="kitB">The screen's <span class="a">3c</span> comes when it takes its turn on the wires.</span></p>`},
{s:'bus',talk:1,build:1,side:'left',html:`<p>Numbers in a field of dashes. Your circuit is correct. You proved it instead of hoping. Then <code>sws-live</code>, breathe on the sensor, and watch the humidity climb.</p>`},

{s:'q1',talk:1,side:'full',html:`<h2>Question 1</h2><p>Which pin carries 3.3 volts, and what happens if you connect 5?</p>`},
{s:'q1',side:'full',html:``},
{s:'q2',talk:1,side:'full',html:`<h2>Question 2</h2><p>Which two addresses answered on the bus? Say what each one is.</p>`},
{s:'q2',side:'full',html:``},
{s:'q3',talk:1,side:'full',html:`<h2>Question 3</h2><p>Write one troubleshooting step, in your own words, for the next student.</p>`},

{s:'recapA',talk:1,side:'left',html:`<div class="kick">checkpoint one</div>

{s:'shiprock',talk:1,side:'left',html:`<div class="kick">who made this before you</div>
  <h2>Shiprock, New Mexico, 1965</h2>
  <p>Fairchild Semiconductor, one of the founding companies of Silicon Valley, opened an integrated circuit plant on Diné land, in the Navajo Nation. It started with fifty-five people and grew into a thirty-three thousand square foot factory.</p>`},
{s:'shiprock',side:'left',html:`<p>At its height it employed more than a thousand Diné people, mostly women, assembling circuits under microscopes. Fairchild became the largest industrial employer on the Navajo Nation.</p>`},
{s:'shiprock',side:'left',html:`<p>The company's 1969 brochure explained why. It put photographs of Diné women at looms next to photographs of Diné women at microscopes and said the work required the same commitment to perfection.</p>`},
{s:'shiprock',side:'left',html:`<p>That comparison did two things at once. It was true about the skill. It was also used to explain why the pay was low, and the same language was reused a few years later about women workers in Asia.</p>`},
{s:'shiprock',talk:1,side:'left',html:`<p>In 1975, after a protest over layoffs and conditions, the plant closed for good. The work moved offshore.</p>`},
{s:'shiprock',talk:1,side:'left',html:`<p>So hold the board in your hand and know this: Native people were not late to this technology. <span class="a">Diné women were building the chips before most of the world had seen one.</span> What was missing was never the skill. It was who owned the plant.</p>`},
{s:'shiprock',talk:1,side:'left',html:`<p>Remember the rug from the start. Marilou Schultz is weaving another one now, of the <span class="a">Fairchild 9040</span>: the chip made at Shiprock, by Diné hands, and the same chip Fairchild put in that brochure next to a photograph of a loom. She is taking the comparison back.</p>
  <div class="meta"><span>Lisa Nakamura, "Indigenous Circuits: Navajo Women and the Racialization of Early Electronic Manufacture", American Quarterly, 2014.</span></div>`},

{s:'code',talk:1,side:'left',html:`<div class="kick">a detour worth taking</div>
  <h2>France, 1918</h2>
  <p>Nineteen Choctaw soldiers from Oklahoma, Chahta in their own language, were asked to send tactical messages across battlefield telephone lines in that language.</p>`},
{s:'code',side:'left',html:`<p>The German army was listening to those lines. They heard every transmission. They could not read one of them.</p>`},
{s:'code',side:'left',html:`<p>Interception and comprehension are two different problems. The wire was never secure. The <span class="a">language</span> was.</p>`},
{s:'code',talk:1,side:'left',html:`<p>Those same soldiers had been punished for speaking that language at home. The thing being erased turned out to be the thing that could not be broken.</p>`},
{s:'code',side:'left',html:`<p>You just built a wire like that one. <code>i2cdetect</code> works because every device on the bus hears everything. Nothing on it is encrypted at all.</p>`},
{s:'code',talk:1,side:'left',html:`<p>Your station takes the third option. It does not put the data on any wire that leaves the box. Three ways to keep something yours. You are using one of them.</p>
  <div class="meta"><span>Choctaw Code Talkers 1918. OurWorlds, premiered at SXSW Film Festival.</span>
  <span>Made with the Choctaw Nation of Oklahoma Historic Preservation Department, descendants of the Code Talkers, and the School of Choctaw Language.</span>
  <span>Classroom curriculum at curriculumst.ourworlds.io</span></div>`},

{s:'cylinder',talk:1,side:'left',html:`<div class="kick">and before that</div>
  <h2>Calais, Maine, 1890</h2>
  <p>An anthropologist arrived with one of Edison's phonographs, a machine less than ten years old, and recorded Passamaquoddy people singing and telling stories onto wax cylinders. Peskotomuhkati, in their own language.</p>`},
{s:'cylinder',side:'left',html:`<p>Those cylinders are the <span class="a">oldest field recordings in the world</span>. Not the oldest Native recordings. The oldest, of anything, made anywhere outside a studio.</p>`},
{s:'cylinder',side:'left',html:`<p>They went to a museum at Harvard, then to the Library of Congress. Passamaquoddy people did not hear them until the 1980s, and by then the copies were too scratched to make out.</p>`},
{s:'cylinder',side:'left',html:`<p>Restored digitally in 2016. Dwayne Tomah, the youngest fluent speaker of the language, sat and transcribed his ancestors singing. He said he wept.</p>`},
{s:'cylinder',talk:1,side:'left',html:`<p>Here is the part that matters for you. For 126 years the intellectual property in those recordings belonged to <span class="a">the man who brought the machine</span>, not to the people whose voices were on them.</p>`},
{s:'cylinder',talk:1,side:'left',html:`<p>The fix was technical. Traditional Knowledge Labels, attached to each recording, set by the tribe: this one may be shared for teaching, this one may not. Running on Mukurtu, software built so a community sets its own rules. Over six hundred groups use it.</p>
  <div class="meta"><span>Jesse Walter Fewkes cylinder recordings, 1890. American Folklife Center, Library of Congress.</span>
  <span>Restored 2016. TK Labels via Local Contexts, hosted on Mukurtu CMS, applied by Passamaquoddy community leaders.</span></div>`},

{s:'missing',talk:1,build:1,side:'left',html:`<div class="kick">when it does not work</div>
  <h2>Nothing showed up</h2>
  <p>This happens to everybody, including people who have done it a hundred times. Work down the list in order.</p>`},
{s:'missing',side:'left',html:`<p>A wire that is half seated looks exactly like a wire that is fully seated. Press each one home again.</p>`},
{s:'missing',side:'left',html:`<p>Then recount the pins, out loud, from pin 1. Swapped power and ground is the most common single mistake.</p>`},
{s:'missing',talk:1,build:1,side:'left',html:`<p>Still nothing? Some sensors ship answering at <span class="a">0x77</span> instead of 0x76. Try it before you decide anything is broken.</p>`},

{s:'verify',talk:1,build:1,side:'left',html:`<div class="kick">step seven</div>
  <h2>Is it the chip you were sold?</h2>
  <p>Every sensor of this type stores its own name in a register. You can ask it directly. It cannot lie about it.</p>`},
{s:'verify',side:'left',html:`<p>Ask register <code>0xD0</code>. The answer is one byte.</p>`},
{s:'verify',side:'left',html:`<p><span class="a">0x60</span> means a real BME280. Your humidity readings are real.</p>`},
{s:'verify',side:'left',html:`<p><span class="a">0x58</span> means somebody shipped a BMP280 in a BME280 package. Same size, same pins, no humidity sensor inside.</p>`},
{s:'verify',talk:1,build:1,side:'left',html:`<p>This happens often enough that checking is standard practice. Nobody is going to do it for you.</p>`},

{s:'screen',talk:1,build:1,side:'left',html:`<div class="kick">step eight</div>
  <h2>Reading your own weather</h2>
  <p>Right now: temperature, humidity, pressure. Press the button and the page changes.</p>`},
{s:'screen',side:'left',html:`<p>Press again for the running totals. Lowest, highest, average, and how many readings it has taken since you set it up.</p>`},

{s:'sunpath',talk:1,side:'left',html:`<div class="kick">step nine</div>
  <h2>The sun is the problem</h2>
  <p>A thermometer sitting in sunlight does not measure the air. It measures itself, warming up. Everything after this is about defeating that.</p>`},
{s:'sunpath',side:'left',html:`<p>In June the sun climbs high and comes almost straight down. A flat cover over the sensor would be enough.</p>`},
{s:'sunpath',side:'left',html:`<p>In December it never gets far off the horizon. The same light now arrives <span class="a">sideways</span>, sliding in under anything you put on top.</p>`},
{s:'sunpath',side:'left',html:`<p>Watch the shadow. At noon in June it is almost nothing. In December it stretches halfway across the yard and stays there all day.</p>`},
{s:'sunpath',talk:1,side:'left',html:`<p>Your station has to survive both, in the same spot, without you touching it. People have been reading this sky far longer than there have been thermometers. You are adding an instrument to it.</p>`},

{s:'shield',talk:1,build:1,side:'left',html:`<div class="kick">the shield</div>
  <h2>Five saucers beat the sun</h2>
  <p>White plastic plant saucers, stacked on a threaded rod. About ten dollars. The same principle as the shelters on official weather stations.</p>`},
{s:'shield',side:'left',html:`<p>The sensor hangs in the middle, touching nothing. Plastic that has been in the sun is warm. A sensor resting against it would read the plastic.</p>`},
{s:'shield',side:'left',html:`<p>Overhead light hits the top saucer and stops there. That is the easy case.</p>`},
{s:'shield',side:'left',html:`<p>An afternoon ray comes in at an angle. It hits the lip of the saucer above the one it was aiming under.</p>`},
{s:'shield',side:'left',html:`<p>Low December light comes in almost flat. The third saucer down catches it. That is why there are five and not three.</p>`},
{s:'shield',talk:1,build:1,side:'left',html:`<p>Cut the centres out of the middle three so warm air rises and leaves through the top. <span class="a">Shade alone is not enough.</span> Still air heats up too.</p>`},

{s:'proof',talk:1,side:'left',html:`<div class="kick">how you know it worked</div>
  <h2>One day, two sensors</h2>
  <p>The real air temperature over a clear day: coldest just before dawn, warmest in mid afternoon. A smooth curve.</p>`},
{s:'proof',side:'left',html:`<p>Now a bare sensor in the same spot. Same curve, plus a <span class="b">hump right at solar noon</span> that has nothing to do with the weather. That is sunlight landing on the sensor itself.</p>`},
{s:'proof',talk:1,side:'left',html:`<p>Inside the shield the hump nearly disappears. Nearly. About a degree survives on still days, because there is no fan pushing air through.</p>`},
{s:'proof',talk:1,side:'left',html:`<p>Run this test on your own data in week one. <span class="a">If you see the midday hump, light is getting in.</span> Knowing your instrument's error is part of owning your data.</p>`},

{s:'trace',talk:1,side:'left',html:`<div class="kick">the question</div>
  <h2>Now do the same to your phone</h2>
  <p>You can name every layer of the thing you just built. Try naming them for the device in your pocket.</p>`},
{s:'trace',side:'left',html:`<p>Which company made the chip? Where is that company based? Can you read its schematic?</p>`},
{s:'trace',talk:1,side:'left',html:`<p>The empty column is the lesson. Not that the phone is bad. That you cannot answer the question, and somebody can.</p>`},

{s:'databack',talk:1,side:'left',html:`<div class="kick">the movement you just joined</div>
  <h2>Land Back</h2>
  <p>You already know this one. Land returned to the nations it was taken from. Not a metaphor and not a slogan. A demand with a legal argument under it.</p>`},
{s:'databack',talk:1,side:'left',html:`<p>And then <span class="a">#DataBack</span>, which says the same thing about the record. Recognition, restitution, reclamation, applied to data and to the systems that hold it. If land can be returned, so can the information taken off it.</p>`},
{s:'databack',side:'left',html:`<p>Here is the part that should stop you. A wampum belt is a data format. It holds a treaty, an agreement, a history, in beads. Reading one properly can take a week. It is not a substitute for paper. It is a different idea of what a record is, and it is older than the alphabet on this page.</p>`},
{s:'databack',side:'left',html:`<p>In 1924, many belts were seized and destroyed by the government. Losing your data is not a new problem here.</p>`},
{s:'databack',talk:1,side:'left',html:`<p>And it is not a finished one. A language organisation spent years recording Lakota elders, then copyrighted the dictionary it built and tried to <span class="a">sell it back to the community</span>. The community banned them. Same pattern as 1890, a hundred and thirty years later.</p>
  <div class="meta"><span>#DataBack, Animikii Indigenous Technology. Building on the Land Back Red Paper, Yellowhead Institute.</span>
  <span>Krystal Tsosie (Diné), Arizona State University, uses DataBack for the return of Indigenous genomic data: hold Indigenous DNA on Indigenous lands.</span></div>`},
{s:'databack',talk:1,side:'left',html:`<p>Every reading on your card is a small piece of that record. You are not preparing to join this movement later. You joined it when the sensor took its first reading.</p>`},

{s:'care',talk:1,side:'left',html:`<div class="kick">there is already a standard</div>
  <h2>CARE</h2>
  <p>You are not the first person to ask who controls a set of numbers. In 2019 the Global Indigenous Data Alliance published four principles for governing Indigenous data, built on the First Nations principles of OCAP developed in Canada in the 1990s.</p>`},
{s:'care',side:'left',html:`<p><span class="a">Collective Benefit.</span> Data about a community should be useful to that community first. Not to whoever collected it.</p>`},
{s:'care',side:'left',html:`<p><span class="a">Authority to Control.</span> The nation decides what is shared, with whom, and when. Not a researcher. Not a company. Not a state agency.</p>`},
{s:'care',side:'left',html:`<p><span class="a">Responsibility.</span> Anyone holding the data has to show how it actually helped.</p>`},
{s:'care',side:'left',html:`<p><span class="a">Ethics.</span> The rights and wellbeing of the people the data is about come before anything else it might be used for.</p>`},
{s:'care',talk:1,side:'left',html:`<p>Most of science runs on <span class="a">FAIR</span>: findable, accessible, interoperable, reusable. Open by default. CARE does not replace that. It asks the question FAIR leaves out. Open to whom, and for whose benefit?</p>
  <div class="meta"><span>CARE Principles for Indigenous Data Governance. Global Indigenous Data Alliance, 2019.</span>
  <span>Carroll, Hudson, Kukutai et al., Data Science Journal, 2020. Building on OCAP&reg;, First Nations Information Governance Centre.</span></div>`},
{s:'care',talk:1,side:'left',html:`<p>You are holding a card with your own land's data on it. Run your six months against these four. They were written for exactly this.</p>`},

{s:'tension',talk:1,side:'left',html:`<div class="kick">where it gets difficult</div>
  <h2>Two good ideas that collide</h2>
  <p>You have met both now. Open source, with its four freedoms. And CARE, where the nation holds authority over its own data. Put them side by side.</p>`},
{s:'tension',side:'left',html:`<p>They agree on a lot. Read it, change it, pass it on. Everything you did today lives in that overlap.</p>`},
{s:'tension',side:'left',html:`<p>But the Open Source Definition has two clauses that are not negotiable. <span class="a">No discrimination against persons or groups.</span> And <span class="a">no discrimination against fields of endeavour</span>: the licence may not stop anyone using it for anything.</p>`},
{s:'tension',side:'left',html:`<p>So a licence saying "not for surveillance" is not open source. A licence saying "our nation decides who gets this" is not open source. Not because they are bad. Because the definition rules them out on purpose.</p>`},
{s:'tension',talk:1,side:'left',html:`<p>That is exactly why Te Hiku Media wrote their own instead of picking one off the shelf. They were not confused about the rules. They read them, and decided the rules cost too much.</p>`},
{s:'tension',talk:1,side:'left',html:`<p>You will have to choose too, on your own data. Publish it openly so anyone can use it, including people you would never approve of. Or keep authority, and give up being open. <span class="a">Nobody gets both.</span></p>
  <div class="meta"><span>The Open Source Definition, Open Source Initiative, clauses 5 and 6.</span>
  <span>The Free Software Definition, freedoms 0 to 3, Free Software Foundation.</span></div>`},

{s:'reo',talk:1,side:'left',html:`<div class="kick">someone wrote a better licence</div>
  <h2>Kaitaia, Aotearoa</h2>
  <p>Te Hiku Media is a small Māori radio station. They wanted speech recognition for te reo Māori, a language their grandparents were beaten in school for speaking. No company was going to build it for them.</p>`},
{s:'reo',side:'left',html:`<p>So they asked. In ten days, two and a half thousand people recorded over two hundred thousand phrases. Three hundred hours of labelled speech, given by the community, for the community.</p>`},
{s:'reo',side:'left',html:`<p>The model they trained transcribes te reo at 92 percent accuracy. It runs on their own machines.</p>`},
{s:'reo',side:'left',html:`<p>Then they did the harder thing. They wrote their own licence, the <span class="a">Kaitiakitanga License</span>, because no existing one said what they meant.</p>`},
{s:'reo',side:'left',html:`<p>It says the data is not owned. It is cared for. Any benefit that comes from it flows back to the people it came from. And it cannot be used to build anything that surveils or discriminates.</p>`},
{s:'reo',talk:1,side:'left',html:`<p>When a large speech model came out that could already handle te reo, they looked at it and refused to use it in production. It did not come with those promises, so it was not theirs to use.</p>
  <div class="meta"><span>Te Reo Irirangi o Te Hiku o Te Ika (Te Hiku Media), Kaitaia, Aotearoa New Zealand.</span>
  <span>Kōrero Māori campaign. Papa Reo. The Kaitiakitanga License.</span></div>`},

{s:'spectrum',talk:1,side:'left',html:`<div class="kick">this is already happening</div>
  <h2>The airwaves over your land</h2>
  <p>Radio spectrum is a public resource the government licenses out. Mostly by auction. Mostly to companies. In 2020 the FCC opened a window for rural Tribes to claim 2.5 GHz spectrum over their own lands first, at no cost.</p>`},
{s:'spectrum',side:'left',html:`<p>The agency is reported to have expected around ten applications.</p>`},
{s:'spectrum',talk:1,side:'left',html:`<p>Roughly four hundred arrived.</p>`},
{s:'spectrum',side:'left',html:`<p>The Havasupai Tribe, Havasu Baaja, the people of the blue-green water, had already built an LTE network at the bottom of the Grand Canyon with MuralNet, on a temporary licence, so students could do their homework. Their success helped make the window happen.</p>`},
{s:'spectrum',talk:1,side:'left',html:`<p>That is your question, one layer up. Not who owns this device. <span class="a">Who owns the air above this ground.</span> People are answering it right now, and they need engineers.</p>`},

{s:'next',talk:1,side:'left',html:`<div class="kick">where this goes</div>
  <h2>You are already inside it</h2>
  <p>Everything in this workshop is somebody's current job. None of it is finished. Here is who is doing it and where to find them.</p>`},
{s:'next',talk:1,side:'left',html:`<p>Start with the one in this building. The <span class="a">AUNTIE Tech Collective</span> at AISES is a multi-generational tech collective for Indigenous girls, womxn, non-binary and two-spirit people. Their own word for what they are doing is <span class="a">rematriating tech</span>.</p>`},
{s:'next',side:'left',html:`<p>It is built as a cycle, on purpose. Girls grow into mentors. Students become leaders. Professionals stay rooted in community. There are two waterways: Future AUNTIES for students, The AUNTIES for professionals. Find them at aises.org/auntie.</p>`},
{s:'next',side:'left',html:`<p><span class="a">The rules.</span> The Global Indigenous Data Alliance wrote CARE. The First Nations Information Governance Centre wrote OCAP. Local Contexts makes the labels that let a community set the terms on its own records.</p>`},
{s:'next',side:'left',html:`<p><span class="a">The tools.</span> Mukurtu is a content system built so a community sets its own protocols. Animikii is an Indigenous-owned software company. Papa Reo is Te Hiku's language platform, still running on their own machines.</p>`},
{s:'next',side:'left',html:`<p><span class="a">The ground.</span> Tribal Digital Village has been running its own broadband across San Diego County reservations since 2001. MuralNet helps tribes build networks. Native BioData Consortium holds Indigenous genomic data on Indigenous land.</p>`},
{s:'next',talk:1,side:'left',html:`<p>Every one of those needs engineers, and there are not enough. AISES was founded in 1977 with a stated vision for <span class="a">the next seven generations</span>. That is a long clock, and you are early on it.</p>
  <div class="meta"><span>AUNTIE Tech Collective, AISES. aises.org/auntie</span>
  <span>GIDA, FNIGC, Local Contexts, Mukurtu, Animikii, Papa Reo, Tribal Digital Village, MuralNet, Native BioData Consortium.</span></div>`},

{s:'yours',talk:1,side:'wide',html:`<p class="lede" style="margin:0 auto">Your twelve answers are not homework. They are one person's position in an argument your nation is already having.</p>`},

{s:'closing',talk:1,side:'wide',html:`<h2>You are not learning about sovereignty. You are practising it.</h2>
  <p style="margin:1.6rem auto 0">Build the station. Deploy it at home. Read it every month. Decide what you share, and be able to say why.</p>
  <p style="margin:1rem auto 0">Then take that answer to the people whose land it was measured on, and see whether they agree with you.</p>
  <div class="meta"><span>ourworlds.io</span></div>`},

});

let renderScene=SCENES[0].s,renderP=0,settled=0,stepNo=0,curSide='left';
function measure(){SCENES.forEach(sc=>{const r=sc.el.getBoundingClientRect();
  sc.top=r.top+scrollY;sc.h=r.height})}
function n2(v){v=Math.abs(Math.round(v));return (v<10?'0':'')+v}
function readScroll(){
  const vh=innerHeight,mid=scrollY+vh*0.5;
  let active=SCENES[0];
  for(const sc of SCENES){if(mid>=sc.top&&mid<sc.top+sc.h){active=sc;break}
    if(mid>=sc.top)active=sc}
  const p=Math.max(0,Math.min(active.steps.length-1,(mid-active.top)/vh-0.5));
  renderScene=active.s;renderP=p;
  settled=Math.abs(p-Math.round(p))<0.055?1:0;
  const st=active.steps[Math.max(0,Math.min(active.steps.length-1,Math.round(p)))];
  curSide=(st&&st.side)||'left';
  let n=0;for(const sc of SCENES){if(sc===active)break;n+=sc.steps.length}
  stepNo=n+Math.round(p)+1;
  const pool=buildMode?STEPS.filter(s2=>s2.dataset.build==='1'):(talkMode?STEPS.filter(s2=>s2.dataset.talk==='1'):STEPS);
  if(countEl){
    let pos=0;
    if(talkMode)pool.forEach((s2,i2)=>{const r=s2.getBoundingClientRect();
      if(r.top+r.height/2+scrollY<=mid+2)pos=i2+1});
    else pos=stepNo;
    countEl.textContent=String(pos).padStart(2,'0')+' / '+pool.length;
    countEl.classList.toggle('on',settled===1);
    if(talkMode&&clockEl){
      const el=talkStart?(Date.now()-talkStart)/1000:0;
      const due=pool.length?(pos/pool.length)*TALK_MINUTES*60:0,dr=el-due;
      clockEl.innerHTML='TALK MODE &nbsp; <b>'+n2(el/60|0)+':'+n2((el|0)%60)+'</b> / '
        +TALK_MINUTES+':00 &nbsp; <span class="'+(dr<0?'ahead':'late')+'">'
        +(dr<0?'-':'+')+n2(Math.abs(dr))+'s</span> &nbsp; T off &middot; R reset';
    }
  }
  STEPS.forEach(st2=>{
    const r=st2.getBoundingClientRect(),c=r.top+r.height/2,d=Math.abs(c-vh/2)/(vh*0.62);
    const o=Math.max(0,1-d*d);
    st2.style.opacity=o.toFixed(3);
    st2.style.transform='translateY('+((c-vh/2)*-0.045).toFixed(1)+'px)';
  });
  const total=document.body.scrollHeight-innerHeight;
  bar.style.width=(total>0?(scrollY/total*100):0)+'%';
  if(scrollY>innerHeight*0.4)cue.classList.add('gone');else cue.classList.remove('gone');
}
function stepTo(dir){
  const vh=innerHeight,mid=scrollY+vh*0.5;
  let best=null,bd=1e9;
  (buildMode?STEPS.filter(s2=>s2.dataset.build==='1'):(talkMode?STEPS.filter(s2=>s2.dataset.talk==='1'):STEPS)).forEach(st=>{
    const r=st.getBoundingClientRect(),c=r.top+r.height/2+scrollY,d=c-mid;
    if(dir>0&&d>vh*0.15&&d<bd){bd=d;best=st}
    if(dir<0&&-d>vh*0.15&&-d<bd){bd=-d;best=st}});
  if(best)best.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});
}
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='b'||k==='B'){buildMode=!buildMode;
    if(buildMode){talkMode=false;document.body.classList.remove('talk');
      clockEl.classList.remove('on')}
    document.body.classList.toggle('build',buildMode);e.preventDefault();return}
  if(k==='t'||k==='T'){talkMode=!talkMode;
    if(talkMode){buildMode=false;document.body.classList.remove('build')}
    if(talkMode&&!talkStart)talkStart=Date.now();
    if(!talkMode)talkStart=0;
    clockEl.classList.toggle('on',talkMode);
    document.body.classList.toggle('talk',talkMode);e.preventDefault();return}
  if(k==='r'&&talkMode){talkStart=Date.now();e.preventDefault();return}
  if(k==='k'||k==='K'){const kb=document.body.classList.toggle('kitB');
    try{localStorage.setItem('bbo-kit',kb?'B':'A')}catch(_){}
    e.preventDefault();return}
  if(k==='g'||k==='G'){idxEl.classList.toggle('on');e.preventDefault();return}
  if(k==='Escape'){idxEl.classList.remove('on');return}
  if(k===' '||k==='ArrowRight'||k==='PageDown'){stepTo(1);e.preventDefault()}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){stepTo(-1);e.preventDefault()}
  else if(k==='Home'){scrollTo({top:0,behavior:'smooth'})}
  else if(k==='End'){scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
});
function resize(){
  DPR=Math.min(2,devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  x.setTransform(DPR,0,0,DPR,0,0);
  U=Math.min(W/1440,H/810);
  measure();readScroll();
}
addEventListener('resize',resize);
addEventListener('scroll',readScroll,{passive:true});

let t0=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
let smooth=0,smoothScene=SCENES[0].s,gate=0,lastErr='';
function tick(now){
  const t=(now-t0)/1000;
  if(smoothScene!==renderScene){smoothScene=renderScene;smooth=renderP}
  smooth+=(renderP-smooth)*(RM?1:0.2);
  try{
    x.clearRect(0,0,W,H);
    const total=document.body.scrollHeight-innerHeight;
    const prog=total>0?Math.max(0,Math.min(1,scrollY/total)):0;
    backdrop(prog,t,DIM[smoothScene]===undefined?0.80:DIM[smoothScene],smoothScene,smooth);
    const fn=SC[smoothScene];if(fn)fn(smooth,t);
    try{youAreHere(smoothScene,t)}catch(e){}
    /* the reading scrim: whatever is behind the words gets pushed down */
    x.save();
    if(curSide==='full'){
      const g=x.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'rgba(8,8,10,.5)');g.addColorStop(0.3,'rgba(8,8,10,0)');
      g.addColorStop(0.7,'rgba(8,8,10,0)');g.addColorStop(1,'rgba(8,8,10,.5)');
      x.fillStyle=g;x.fillRect(0,0,W,H);
    }else if(curSide==='wide'){
      const g=x.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.62);
      g.addColorStop(0,'rgba(8,8,10,.90)');g.addColorStop(0.55,'rgba(8,8,10,.72)');
      g.addColorStop(1,'rgba(8,8,10,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
    }else{
      const right=(curSide==='right');
      const g=x.createLinearGradient(right?W:0,0,right?W*0.36:W*0.64,0);
      g.addColorStop(0,'rgba(8,8,10,.94)');g.addColorStop(0.55,'rgba(8,8,10,.80)');
      g.addColorStop(1,'rgba(8,8,10,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
    }
    const gv=x.createLinearGradient(0,0,0,H);
    gv.addColorStop(0,'rgba(8,8,10,.55)');gv.addColorStop(0.22,'rgba(8,8,10,0)');
    gv.addColorStop(0.80,'rgba(8,8,10,0)');gv.addColorStop(1,'rgba(8,8,10,.55)');
    x.fillStyle=gv;x.fillRect(0,0,W,H);x.restore();
    /* the frame gate: a slide-like rest when the page settles */
    gate+=(settled-gate)*(RM?1:0.10);
    if(gate>0.02){
      x.save();const m=px(26),c2=px(18);
      x.globalAlpha=gate*0.40;frame(m,m,W-m*2,H-m*2,'#2E2E3A',px(1));
      x.globalAlpha=gate*0.85;
      [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(g2=>{
        rect(g2[0],g2[1],g2[2]*c2,px(1.5),C.accent);
        rect(g2[0],g2[1],px(1.5),g2[3]*c2,C.accent)});
      x.restore();
    }
  }catch(err){
    lastErr=smoothScene+': '+(err&&err.message?err.message:err);
    try{rect(0,0,W,H,C.bg);
      mono(lastErr,W*0.30,H*0.5,C.bad,14);
      mono('the words still work. scroll on.',W*0.30,H*0.5+px(24),C.dim,13);
    }catch(e2){}
  }
  requestAnimationFrame(tick);
}
resize();requestAnimationFrame(tick);
})();
</script>
