<text x="40.0" y="946.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" >Say it out loud: red leaves 14 and arrives at VIN. Black leaves 15 and arrives at GND. Blue leaves 26 and arrives at SDA. Yellow leaves 28 and arrives at SCL.</text>
<text x="40.0" y="966.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" >Nothing in P1.1. Then Part 3 (the card) and Part 4 (power). The sensor alone is a working station: readings come to your laptop with sws-live.</text>
