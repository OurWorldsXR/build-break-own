<text x="40.0" y="946.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" >Only after the sensor has answered in Part 5. USB out first; never move a wire with power on. The screen alone shows the pages with -- where readings would be.</text>
<text x="40.0" y="966.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" >A screen and a sensor together need a breadboard (Kit A). Until one arrives, this proves both parts and all four pins, which is most of the work.</text>
