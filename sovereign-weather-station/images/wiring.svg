<text x="155.0" y="146" font-size="11" text-anchor="middle" fill="#555">P1 header, USB-C side. Pins 13 to 30, drawn as a list.</text>
<rect x="60" y="162" width="60" height="22" rx="4" fill="#ccc"/><text x="90" y="177" font-size="10" text-anchor="middle">USB-C</text>
<rect x="236" y="194" width="12" height="12" fill="#fff" stroke="#999"/>
