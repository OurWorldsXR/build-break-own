<circle cx="390" cy="620" r="4" fill="#2b5fc8"/>
<rect x="486" y="636" width="12" height="12" fill="#fff" stroke="#333"/>
<text x="506" y="646" font-size="12" fill="#999">32K, SQW  (leave open)</text>
<text x="492" y="670" font-size="11" fill="#555">answers at 0x68. 0x57 is the EEPROM on the same module</text>
