<circle cx="390" cy="444" r="4" fill="#2b5fc8"/>
<text x="492" y="472" font-size="11" fill="#555">answers at 0x3C</text>
<rect x="480" y="496" width="330" height="184" rx="8" fill="#fbfbfb" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
<text x="492" y="516" font-size="14" font-weight="bold">DS3231 real time clock  (optional)</text>
<text x="492" y="532" font-size="11" fill="#555">keeps time on a coin cell when the board is off</text>
