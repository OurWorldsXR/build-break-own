<text x="155" y="600" font-size="10" text-anchor="middle" fill="#777">on the board, odd pins are one row, even pins the other</text><text x="375" y="712" font-size="11" text-anchor="middle" fill="#555">breadboard: two rails, two rows</text>
<rect x="480" y="100" width="330" height="206" rx="8" fill="#f7f7ff" stroke="#555" stroke-width="2" stroke-dasharray="none"/>
<text x="492" y="120" font-size="14" font-weight="bold">BME280 sensor</text>
<text x="492" y="136" font-size="11" fill="#555">temperature, pressure, humidity. 3.3 V logic</text>
<rect x="486" y="152" width="12" height="12" fill="#c8322b" stroke="#333"/>
<text x="506" y="162" font-size="12" fill="#111">VIN / VCC</text>
