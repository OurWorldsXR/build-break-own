<circle cx="420" cy="202" r="4" fill="#d9a300"/>
<rect x="486" y="218" width="12" height="12" fill="#2b5fc8" stroke="#333"/>
<text x="506" y="228" font-size="12" fill="#111">SDA</text>
<path d="M 390 224 H 486" stroke="#2b5fc8" stroke-width="3" fill="none"/>
<circle cx="390" cy="224" r="4" fill="#2b5fc8"/>
<rect x="486" y="240" width="12" height="12" fill="#fff" stroke="#333"/>
<text x="506" y="250" font-size="12" fill="#999">CSB  (leave open; 6-pin boards only)</text>
<rect x="486" y="262" width="12" height="12" fill="#fff" stroke="#333"/>
<text x="506" y="272" font-size="12" fill="#999">SDO  (open = 0x76, tied to 3V3 = 0x77)</text>
<text x="492" y="296" font-size="11" fill="#555">answers at 0x76 or 0x77. chip ID 0x60 = BME280, 0x58 = BMP280</text>
<rect x="480" y="320" width="330" height="162" rx="8" fill="#f7f7ff" stroke="#555" stroke-width="2" stroke-dasharray="none"/>
<text x="492" y="340" font-size="14" font-weight="bold">SSD1306 OLED, 128 x 64, I2C</text>
<text x="492" y="356" font-size="11" fill="#555">read the silkscreen: VCC and GND order varies by vendor</text>
<rect x="486" y="372" width="12" height="12" fill="#c8322b" stroke="#333"/>
<text x="506" y="382" font-size="12" fill="#111">VCC</text>
