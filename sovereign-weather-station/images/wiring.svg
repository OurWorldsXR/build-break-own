<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="730" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold">Sovereign Weather Station: wiring</text>
<text x="30" y="64" font-size="13" fill="#444">PocketBeagle 2, P1 header. Four wires. Every module gets all four. 3.3 V only, never P1.01 (5 V).</text>
