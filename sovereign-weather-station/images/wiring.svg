<path d="M 248 220 H 330" stroke="#c8322b" stroke-width="3" fill="none"/>
<circle cx="330" cy="220" r="4" fill="#c8322b"/>
<path d="M 248 240 H 360" stroke="#222222" stroke-width="3" fill="none"/>
